services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdedb}
      POSTGRES_USER: ${POSTGRES_USER:-cde}
      # No default. The database holds every project, document and
      # annotation; starting it with a password baked into a committed file
      # is how a demo instance ends up reachable in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before starting}
    # Not published on the host. Only cde-app needs to reach it; exposing
    # 5432 puts the database on the host's network for no benefit.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # cde-app waits for this. Without it the application starts first, finds
      # no database, and Flyway fails on an empty connection.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cde} -d ${POSTGRES_DB:-cdedb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  converter:
    build:
      context: ./converter
    # Not published on the host by default — only cde-app needs to reach
    # it, and the converter has no authentication of its own.
    expose:
      - "5001"
    environment:
      CONVERTER_PORT: 5001
      # Point this at a mounted ODA File Converter to get higher-fidelity
      # DWG conversion; unset, DWG falls back to the bundled LibreDWG.
      ODA_PATH: ${ODA_PATH:-}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      # /health reports whether LibreOffice, LibreDWG and Tesseract were
      # actually found, so a bad image is caught here rather than on a
      # user's first upload.
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  cde-app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Shared with the converter: the app sends absolute paths over HTTP
      # and the converter opens them directly, so both containers must see
      # the same files at the same paths. Both images also run as uid 10001
      # so each can read what the other wrote — changing either uid alone
      # breaks every conversion with EACCES.
      - uploads:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CDE_CONVERTER_URL: http://converter:5001
      CDE_STORAGE_UPLOAD_DIR: /app/uploads
      # Override in deployment. The application.yml default is a shipped
      # placeholder and must not be used anywhere real.
      CDE_JWT_SECRET: ${CDE_JWT_SECRET:?set CDE_JWT_SECRET before starting}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cdedb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cde}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before starting}
    depends_on:
      db:
        condition: service_healthy
      converter:
        condition: service_healthy
    healthcheck:
      # The readiness probe, not "/". A static page answers 200 while the
      # database is unreachable, so the old check reported a container that
      # could not serve a single request as healthy. Readiness covers the
      # database and deliberately excludes the converter — a converter outage
      # must not mark this container unhealthy and have Docker restart it.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  # A named volume rather than a bind mount: Docker seeds a named volume's
  # ownership from the image, where /app/uploads is already owned by uid
  # 10001. A bind mount takes the host directory's ownership instead —
  # usually root — and both containers then fail every write with EACCES.
  # To use a host directory anyway, chown it to 10001:10001 first.
  uploads:

  # The database. Removing this volume destroys every project, document and
  # annotation — `docker compose down -v` included.
  pgdata:
