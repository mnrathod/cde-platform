# Test overrides, activated for every test by the `test` task in build.gradle.
#
# The suite runs against a real PostgreSQL, started once per JVM by
# PostgresTestSessionListener. It used to run on H2 in PostgreSQL compatibility
# mode, which was faster and needed no Docker, and that trade is no longer
# available: Row-Level Security is the highest-severity control on the platform
# and H2 does not implement it. Tests on H2 would report tenant isolation
# passing while the mechanism under test was absent entirely.
#
# Migrations run here too, for the same reason — the RLS policies, the
# restricted role and the SECURITY DEFINER login resolver are all created by
# V2, so a schema built by Hibernate instead would be missing every part of
# tenancy that matters.
spring:
  datasource:
    url: ${test.datasource.url}
    username: ${test.datasource.username}
    password: ${test.datasource.password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema belongs to the migrations here exactly as it does in
      # production, so drift between the two fails the suite rather than being
      # papered over by create-drop.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

cde:
  jwt:
    # Tests need a signing key and must not depend on the environment supplying
    # one. Only ever loaded from the test classpath, and long enough to satisfy
    # the 32-byte minimum JwtProperties enforces.
    secret: test-only-signing-key-not-used-outside-the-test-suite-0123456789
  security:
    password:
      # The production floor is 600,000 and is enforced by validation, so it
      # cannot be lowered here — this is the real cost, deliberately. Roughly
      # half a second per hash, which the seeder pays twice per context.
      kdf: pbkdf2-sha256
  storage:
    upload-dir: ./build/test-uploads
