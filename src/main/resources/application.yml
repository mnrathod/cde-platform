server:
  port: 8080
  # In-flight requests finish before the process exits. Without this a rolling
  # update cuts off whatever upload or conversion was running at the moment the
  # pod was told to stop.
  shutdown: graceful

spring:
  application:
    name: cde-platform

  datasource:
    # Every value is overridable by environment variable, which is how the
    # container and the cluster supply theirs. The defaults point at a local
    # PostgreSQL so that running the application without any environment set
    # fails to connect, rather than silently succeeding against an in-memory
    # database that discards everything on exit.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cdedb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:cde}
    password: ${SPRING_DATASOURCE_PASSWORD:cde}
    hikari:
      # A pool per replica. The default of 10 is fine for one; raising replicas
      # multiplies this against PostgreSQL's max_connections, which is where a
      # scaled-out deployment usually runs out first.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  jpa:
    hibernate:
      # The schema belongs to Flyway. `validate` means a mapping that has
      # drifted from the migrations stops the application at startup instead
      # of being discovered as a missing column mid-request.
      ddl-auto: validate
    # Left at Spring's default of true, deliberately.
    #
    # Turning it off is the right destination — it is what keeps a lazy
    # association from being fetched one row at a time during serialisation —
    # but the entities are not ready for it: Project.documents is lazy and is
    # serialised outside the transaction, so GET /api/projects fails with a
    # LazyInitializationException the moment it is disabled. Fixing that means
    # fetch joins or DTO projections across the repositories, which is its own
    # change with its own testing. Bundling it into a database migration would
    # have shipped a migration that broke listing documents.
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Left off deliberately. Baselining would stamp an existing database as
    # migrated without running V1, and `validate` would then fail against a
    # schema Flyway believes it created.
    baseline-on-migrate: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  lifecycle:
    # Long enough for an upload or a conversion to finish, short enough that a
    # rolling update is not held open by one stuck request.
    timeout-per-shutdown-phase: 25s

springdoc:
  api-docs:
    # The specification itself is public: a client generator, a linter and a
    # reviewer all need to read it, and it describes the shape of the API
    # rather than any data held in it.
    path: /api/openapi
    version: openapi_3_1
  swagger-ui:
    path: /api/docs
    # Operations grouped by tag, in the order the tags are declared, rather
    # than alphabetically — so Authentication comes before Annotations, which
    # is the order someone reads them in.
    tags-sorter: as-declared
    operations-sorter: alpha
    # The "try it" console is a production feature only where someone has
    # deliberately made it one. It sends real requests with real credentials
    # from a page that also documents every endpoint, which is a different
    # thing from publishing the specification.
    #
    # An empty list. springdoc serialises this key into its swagger-config as
    # the string "[]" rather than as a JSON array — written as a list here or
    # bound from an environment variable, the served value is the same string,
    # so reading the config back proves nothing either way.
    #
    # What was verified is the rendered page: /api/docs loads all 52 operations
    # and no "Try it out" button. A deployment that wants the console overrides
    # this key with the methods it wants to allow.
    supported-submit-methods: []
  # A property with no getter is not part of the API, and a synthetic
  # `getX()`-shaped accessor on a record is not a property either.
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

cde:
  api:
    # The API's own version, which moves with the contract rather than with
    # the build. Path versioning (/api/v1) is the compatibility boundary; this
    # records where within that boundary a given deployment sits.
    version: 1.0.0
  jwt:
    # No default, deliberately. A signing key with a fallback value is a
    # published key — see JwtProperties, which refuses to bind a missing,
    # short, or previously-committed secret and stops the application rather
    # than letting it boot able to verify tokens anyone can mint.
    #
    #   export CDE_JWT_SECRET="$(openssl rand -base64 48)"
    secret: ${CDE_JWT_SECRET:}
    expiration-ms: ${CDE_JWT_EXPIRATION_MS:86400000}   # 24 hours
  storage:
    upload-dir: ./uploads
  upload:
    # Bounds on a chunked upload in flight. Each has a working default, so a
    # deployment that sets none of them is still bounded — the alternative is
    # a staging area an attacker fills with one request per upload.
    #
    # max-file-size is enforced as the exact running total of what has been
    # staged, not estimated from the chunk count. Two gigabytes is the scale of
    # a federated model, which is what this path exists for.
    max-file-size: 2GB
    max-chunk-size: 8MB
    max-chunks: 4096
    staging-expiry: PT24H
  converter:
    url: http://localhost:5001
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}   # set via env var or replace with your key here

management:
  endpoints:
    web:
      exposure:
        # Named explicitly rather than "*". Actuator ships endpoints that dump
        # the whole environment, every config property and a heap dump —
        # exposing them and relying only on the security rules would mean one
        # mistake there leaks credentials.
        include: health,info,metrics,prometheus

  endpoint:
    health:
      # Adds /actuator/health/liveness and /actuator/health/readiness. They are
      # separate on purpose: liveness answers "should this pod be restarted",
      # readiness answers "should it receive traffic". Pointing both at the
      # aggregate health means any dependency outage restarts every pod, which
      # turns a degraded system into an outage.
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      group:
        readiness:
          # The database, because without it no request can be served. Not the
          # converter — see ConverterHealthIndicator.
          include: readinessState,db
      status:
        # DEGRADED sits between DOWN and UP, so an aggregate containing it
        # reports DEGRADED rather than UP, but still answers 200: the service
        # is worth routing traffic to, and worth telling someone about.
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200

  metrics:
    tags:
      # Every series is labelled, so one Prometheus can hold more than one
      # deployment without the numbers silently adding together.
      application: ${spring.application.name}

  info:
    env:
      # Would publish every cde.* property, the JWT secret among them.
      enabled: false
    build:
      enabled: true
