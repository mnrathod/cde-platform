server:
  port: 8080

spring:
  application:
    name: cde-platform

  datasource:
    url: jdbc:h2:mem:cdedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

cde:
  jwt:
    secret: cde-platform-super-secret-key-change-in-production-2024
    expiration-ms: 86400000   # 24 hours
  storage:
    upload-dir: ./uploads
  converter:
    url: http://localhost:5001
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}   # set via env var or replace with your key here
