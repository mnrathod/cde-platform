server:
  port: 8080
  # In-flight requests finish before the process exits. Without this a rolling
  # update cuts off whatever upload or conversion was running at the moment the
  # pod was told to stop.
  shutdown: graceful

spring:
  application:
    name: cde-platform

  datasource:
    # Every value is overridable by environment variable, which is how the
    # container and the cluster supply theirs. The defaults point at a local
    # PostgreSQL so that running the application without any environment set
    # fails to connect, rather than silently succeeding against an in-memory
    # database that discards everything on exit.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cdedb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:cde}
    password: ${SPRING_DATASOURCE_PASSWORD:cde}
    hikari:
      # A pool per replica. The default of 10 is fine for one; raising replicas
      # multiplies this against PostgreSQL's max_connections, which is where a
      # scaled-out deployment usually runs out first.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  jpa:
    hibernate:
      # The schema belongs to Flyway. `validate` means a mapping that has
      # drifted from the migrations stops the application at startup instead
      # of being discovered as a missing column mid-request.
      ddl-auto: validate
    # Left at Spring's default of true, deliberately.
    #
    # Turning it off is the right destination — it is what keeps a lazy
    # association from being fetched one row at a time during serialisation —
    # but the entities are not ready for it: Project.documents is lazy and is
    # serialised outside the transaction, so GET /api/projects fails with a
    # LazyInitializationException the moment it is disabled. Fixing that means
    # fetch joins or DTO projections across the repositories, which is its own
    # change with its own testing. Bundling it into a database migration would
    # have shipped a migration that broke listing documents.
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Left off deliberately. Baselining would stamp an existing database as
    # migrated without running V1, and `validate` would then fail against a
    # schema Flyway believes it created.
    baseline-on-migrate: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  lifecycle:
    # Long enough for an upload or a conversion to finish, short enough that a
    # rolling update is not held open by one stuck request.
    timeout-per-shutdown-phase: 25s

springdoc:
  api-docs:
    # The specification itself is public: a client generator, a linter and a
    # reviewer all need to read it, and it describes the shape of the API
    # rather than any data held in it.
    path: /api/openapi
    version: openapi_3_1
  swagger-ui:
    path: /api/docs
    # Operations grouped by tag, in the order the tags are declared, rather
    # than alphabetically — so Authentication comes before Annotations, which
    # is the order someone reads them in.
    tags-sorter: as-declared
    operations-sorter: alpha
    # The "try it" console is a production feature only where someone has
    # deliberately made it one. It sends real requests with real credentials
    # from a page that also documents every endpoint, which is a different
    # thing from publishing the specification.
    #
    # An empty list. springdoc serialises this key into its swagger-config as
    # the string "[]" rather than as a JSON array — written as a list here or
    # bound from an environment variable, the served value is the same string,
    # so reading the config back proves nothing either way.
    #
    # What was verified is the rendered page: /api/docs loads all 52 operations
    # and no "Try it out" button. A deployment that wants the console overrides
    # this key with the methods it wants to allow.
    supported-submit-methods: []
  # A property with no getter is not part of the API, and a synthetic
  # `getX()`-shaped accessor on a record is not a property either.
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

cde:
  api:
    # The API's own version, which moves with the contract rather than with
    # the build. Path versioning (/api/v1) is the compatibility boundary; this
    # records where within that boundary a given deployment sits.
    version: 1.0.0
  jwt:
    # No default, deliberately. A signing key with a fallback value is a
    # published key — see JwtProperties, which refuses to bind a missing,
    # short, or previously-committed secret and stops the application rather
    # than letting it boot able to verify tokens anyone can mint.
    #
    #   export CDE_JWT_SECRET="$(openssl rand -base64 48)"
    secret: ${CDE_JWT_SECRET:}
    expiration-ms: ${CDE_JWT_EXPIRATION_MS:86400000}   # 24 hours
  seed:
    # Off. This used to run unconditionally and create an administrator whose
    # username and password were both written in the source, which meant every
    # deployment shipped with a known credential. A deployment that wants
    # demonstration data asks for it and supplies its own password; one that
    # says nothing starts empty and creates its first organisation by
    # registering. See SeedProperties.
    enabled: ${CDE_SEED_ENABLED:false}
    admin-username: ${CDE_SEED_ADMIN_USERNAME:admin}
    admin-email: ${CDE_SEED_ADMIN_EMAIL:admin@cde.invalid}
    # No default. Required only when enabled is true, and refused if it is
    # shorter than the password policy's minimum or equal to the value this
    # seeder used to hard-code.
    admin-password: ${CDE_SEED_ADMIN_PASSWORD:}

  web:
    # Which other origins a browser may let call this API. Empty means none,
    # and none means no CORS configuration is registered at all — not one that
    # allows everything, which is what `allowedOrigins("*")` used to do here.
    #
    # A same-origin deployment (Angular and this API behind one web tier) needs
    # nothing set. Name each origin in full; a wildcard is refused at startup.
    #
    #   CDE_WEB_ALLOWED_ORIGINS=https://app.example.com,https://admin.example.com
    allowed-origins: ${CDE_WEB_ALLOWED_ORIGINS:}
    # Inert over plain HTTP, so it costs a local deployment nothing and is on
    # by default — switching it off in the one environment that terminates TLS
    # is the mistake worth preventing.
    hsts-enabled: ${CDE_WEB_HSTS_ENABLED:true}
    hsts-max-age-seconds: ${CDE_WEB_HSTS_MAX_AGE_SECONDS:31536000}
    # Where a browser posts content-security-policy violations. Blank adds no
    # reporting directive; the policy still blocks, it just tells nobody.
    csp-report-uri: ${CDE_WEB_CSP_REPORT_URI:}

  # Second factor (4.4). Off unless a deployment provisions an encryption key:
  # a TOTP secret is a bearer credential with nothing to crack, so a built-in
  # key would make every deployment's second factors forgeable by anyone who
  # reads this repository.
  mfa:
    enabled: ${CDE_MFA_ENABLED:false}
    # Shown beside the account in the authenticator app, so a user holding
    # several accounts can tell them apart.
    issuer: ${CDE_MFA_ISSUER:CDE Platform}
    # AES-256 key protecting TOTP secrets at rest. Base64, exactly 32 bytes.
    # REQUIRED when enabled, no default.  openssl rand -base64 32
    secret-encryption-key: ${CDE_MFA_SECRET_ENCRYPTION_KEY:}
    # SHA1 is the RFC 6238 default and the only one every authenticator app
    # supports. SHA256 works where a deployment requires it, at the cost of
    # some apps failing enrolment without saying why.
    algorithm: ${CDE_MFA_ALGORITHM:SHA1}

  storage:
    upload-dir: ./uploads

    # Which object-storage backend is active (§11). Only `local` is implemented;
    # selecting s3, azure or gcs fails at startup rather than silently writing
    # customer data somewhere nothing backs up. See docs/adr/0011-storage-abstraction.md.
    provider: ${CDE_STORAGE_PROVIDER:local}

    # First segment of every storage key. Keeps a staging deployment pointed at
    # a shared bucket from writing over production objects.
    environment: ${CDE_STORAGE_ENVIRONMENT:local}

    # Filesystem root for the local provider.
    local-root: ${CDE_STORAGE_LOCAL_ROOT:./storage}

    # Signs the local provider's time-limited download URLs. REQUIRED, no
    # default: a built-in signing key is a published one, and whoever holds it
    # can mint a URL for any object in any tenant. Generate with
    #   openssl rand -base64 32
    signing-key: ${CDE_STORAGE_SIGNING_KEY:}

    # Origin those URLs point at. In production this should be a separate host
    # from the application, so a stored HTML or SVG payload cannot execute
    # against the application's own origin (§5.13.8).
    download-base-uri: ${CDE_STORAGE_DOWNLOAD_BASE_URI:http://localhost:8080}
  upload:
    # Bounds on a chunked upload in flight. Each has a working default, so a
    # deployment that sets none of them is still bounded — the alternative is
    # a staging area an attacker fills with one request per upload.
    #
    # max-file-size is enforced as the exact running total of what has been
    # staged, not estimated from the chunk count. Two gigabytes is the scale of
    # a federated model, which is what this path exists for.
    max-file-size: 2GB
    max-chunk-size: 8MB
    max-chunks: 4096
    staging-expiry: PT24H
    # What an unreachable malware scanner means (§5.13.4/5). Every upload is
    # written to quarantine, examined there, and only promoted once it is
    # clean — so this decides what happens when the examination cannot happen.
    #
    #   required     refuse the upload; a scanner that is down stops uploads
    #   best-effort  admit it with a logged warning (the default)
    #   disabled     do not scan at all — a documented risk acceptance
    #
    # A shared Common Data Environment should be `required`: a file admitted
    # unscanned is one every appointed party on the project will open.
    scanning: ${CDE_UPLOAD_SCANNING:best-effort}
    # A ClamAV daemon, reached over a socket and never linked or embedded —
    # ClamAV is GPLv2, and out-of-process is what keeps it licence-compatible.
    # With `scanning: required` and no host set, the application refuses to
    # start rather than refusing every upload at runtime.
    scanner-host: ${CDE_UPLOAD_SCANNER_HOST:}
    scanner-port: ${CDE_UPLOAD_SCANNER_PORT:3310}
    scanner-timeout: ${CDE_UPLOAD_SCANNER_TIMEOUT:PT30S}
  converter:
    url: http://localhost:5001
  ai:
    # Assisted summaries (§10). Absent credentials simply mean the feature
    # reports itself unavailable — the rest of the platform does not depend on
    # it, so an absent key is not a reason to refuse to start.
    #
    # The tier check comes first regardless: a government or Defence deployment
    # makes no outbound calls, and no amount of configuration here changes that.
    api-key: ${CDE_AI_API_KEY:${ANTHROPIC_API_KEY:}}
    # No default. A model identifier carries a dated version that goes out of
    # support, and one written here would be wrong within a year and wrong
    # silently — the provider would simply start refusing calls. Name the model
    # this deployment has contracted for.
    model: ${CDE_AI_MODEL:}
    # Point this at a self-hosted or in-region endpoint for local inference,
    # which is a configuration decision rather than a fork.
    endpoint: ${CDE_AI_ENDPOINT:https://api.anthropic.com/v1/messages}
    # Caps what one call can cost. Enforced here rather than accepted from the
    # caller, because the caller does not pay for it.
    max-output-tokens: ${CDE_AI_MAX_OUTPUT_TOKENS:1500}
    timeout: ${CDE_AI_TIMEOUT:PT60S}

management:
  endpoints:
    web:
      exposure:
        # Named explicitly rather than "*". Actuator ships endpoints that dump
        # the whole environment, every config property and a heap dump —
        # exposing them and relying only on the security rules would mean one
        # mistake there leaks credentials.
        include: health,info,metrics,prometheus

  endpoint:
    health:
      # Adds /actuator/health/liveness and /actuator/health/readiness. They are
      # separate on purpose: liveness answers "should this pod be restarted",
      # readiness answers "should it receive traffic". Pointing both at the
      # aggregate health means any dependency outage restarts every pod, which
      # turns a degraded system into an outage.
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      group:
        readiness:
          # The database, because without it no request can be served. Not the
          # converter — see ConverterHealthIndicator.
          include: readinessState,db
      status:
        # DEGRADED sits between DOWN and UP, so an aggregate containing it
        # reports DEGRADED rather than UP, but still answers 200: the service
        # is worth routing traffic to, and worth telling someone about.
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200

  metrics:
    tags:
      # Every series is labelled, so one Prometheus can hold more than one
      # deployment without the numbers silently adding together.
      application: ${spring.application.name}

  info:
    env:
      # Would publish every cde.* property, the JWT secret among them.
      enabled: false
    build:
      enabled: true
