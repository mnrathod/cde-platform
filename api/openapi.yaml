  /api/cde/revisions/{revisionId}/transitions:
    get:
      description: |-
        Every state change the revision has been through, oldest first, with who performed it, when, and why.

        The history is append-only in the database rather than by convention: the application holds no grant to update or delete a row in this table, so no code path can rewrite it however privileged it is.

        Requires the `container:read` permission.
      operationId: listRevisionTransitions
      parameters:
      - description: Identifier of the revision.
        example: 2049
        in: path
        name: revisionId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContainerTransitionResponse"
          description: "The transition history, oldest first."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
