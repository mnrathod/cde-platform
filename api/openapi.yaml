                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: List the markup on a document
      tags:
      - Annotations
  /api/annotations/document/{documentId}/xfdf:
    get:
      description: |-
        XFDF is the interchange format Acrobat and most PDF tools read, so markup made here can be opened elsewhere and vice versa.

        The reply is a file download, not JSON.

        Requires the `annotation:read` permission.
      operationId: exportAnnotationsAsXfdf
      parameters:
      - description: Identifier of the document.
        example: 1180
        in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/vnd.adobe.xfdf:
              schema:
                type: string
                format: binary
          description: The markup as an XFDF document.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No document with that id is visible to the caller.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Export a document's markup as XFDF
      tags:
      - Annotations
    post:
      description: |-
        Adds the file's markup to the document, attributed to the authenticated caller. Existing markup is left alone — importing adds, it does not replace.

        A file containing no markup is not an error: nothing is imported and the reply says so, because "the file was empty" and "the file was rejected" call for different things from the person who chose it.

        The file is parsed with external entities and DTDs disabled.

        Requires the `annotation:write` permission.
      operationId: importAnnotationsFromXfdf
      parameters:
      - description: Identifier of the document to add the markup to.
        example: 1180
        in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The XFDF file.
              required:
              - file
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XfdfImportResponse"
          description: The file was read. `imported` may be zero if it held no markup.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No document with that id is visible to the caller.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The file is not readable XFDF.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Import markup from an XFDF file
      tags:
      - Annotations
  /api/annotations/replies/{replyId}:
    delete:
      description: |-
        Removes the reply only; the markup it belongs to and the rest of the thread are untouched.

        Requires the `annotation:write` permission.
      operationId: deleteAnnotationReply
      parameters:
      - description: Identifier of the reply.
        example: 3311
        in: path
        name: replyId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: The reply is gone.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
