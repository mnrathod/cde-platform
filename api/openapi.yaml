  /api/documents/upload:
    post:
      description: |-
        Multipart upload for a file small enough to send in a single request. For a large file use the chunked route, which survives an interrupted connection.

        The stored name is generated server-side; the name the client sent is kept as metadata for display and for the download header only, and is never used as a path.

        The media type is taken from the file's extension, falling back to what the browser claimed. That is a rendering hint, not a security check — it decides which viewer opens the file, and the formats that matter here are drawing and model formats that content sniffing reports as generic binary. Do not read it as a statement about what the bytes are.

        The body is streamed to storage rather than buffered, so the size a deployment can accept is a matter of disk and configuration rather than of heap.

        Requires the `document:write` permission on the target project.
      operationId: uploadDocument
      parameters:
      - description: Project to file the document under.
        example: 42
        in: query
        name: projectId
        required: true
        schema:
          type: integer
          format: int64
      - description: "Display name, independent of the file name."
        example: GA Plan — Level 02
        in: query
        name: name
        required: true
        schema:
          type: string
      - description: Free text about this document.
        example: Issued for coordination.
        in: query
        name: description
        required: false
        schema:
          type: string
      - description: What kind of document this is.
        example: DRAWING
        in: query
        name: documentType
        required: false
        schema:
          type: string
          default: DRAWING
      - description: Revision identifier as the originator issued it.
        example: P02.1
        in: query
        name: revision
        required: false
        schema:
          type: string
      - description: Drawing number from the title block.
        example: RVD-XX-02-DR-A-1200
        in: query
        name: drawingNumber
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file itself.
              required:
              - file
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
          description: The document as created.
        "400":
          content:
