  /api/audit-events:
    get:
      description: |-
        Returns this organisation's security-relevant events, newest first. The trail is append-only and hash-chained: each record carries the SHA-256 of the record before it, so an alteration anywhere breaks every hash after it, and the sequence numbers are contiguous so a removal leaves a gap.

        Both hashes are returned so that an organisation streaming this to its own SIEM can verify the chain itself rather than being told it verified.

        Records never carry a credential, a request body, or raw personal data — what changed is summarised by field name, with values that are identifiers or booleans.

        Requires the `tenant.audit:read` permission.
      operationId: listAuditEvents
      parameters:
      - description: Zero-based page index.
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: "Records per page, at most 200."
        example: 50
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Return only records for this action.
        example: AUTHORISATION_DENIED
        in: query
        name: action
        required: false
        schema:
          type: string
          enum:
          - SIGN_IN
          - SIGN_OUT
          - REGISTRATION
          - PASSWORD_CHANGE
          - MFA_ENROLMENT_STARTED
          - MFA_ENROLMENT_CONFIRMED
          - MFA_VERIFIED
          - MFA_RECOVERY_REDEEMED
          - MFA_RECOVERY_REGENERATED
          - MFA_DISABLED
          - INVITATION_ISSUED
          - INVITATION_REVOKED
          - INVITATION_REDEEMED
          - ROLE_CHANGED
          - AUTHORISATION_DENIED
          - CONTAINER_CREATED
          - CONTAINER_TRANSITIONED
          - CONTAINER_SUPERSEDED
          - DOCUMENT_UPLOADED
          - DOCUMENT_DOWNLOADED
          - DOCUMENT_DELETED
          - DOCUMENT_REJECTED_BY_SCAN
          - BULK_EXPORT
          - AI_REQUEST
          - TENANT_SETTING_CHANGED
          - API_KEY_ISSUED
          - API_KEY_REVOKED
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
          description: "A page of records, newest first."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Read this organisation's audit trail
      tags:
      - Audit trail
  /api/audit-events/verification:
    get:
      description: |-
        Reads the whole trail and recomputes each record's hash from its contents and the hash of the record before it. Reports the first record that does not verify, or that the chain is intact.

        This detects tampering; it does not prevent it. Prevention needs storage the application cannot reach — the trail is shaped to be exported to write-once storage for that.

        Reads every record, so it is an operator action rather than something to poll. Requires the `tenant.audit:read` permission.
      operationId: verifyAuditChain
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditChainVerificationResponse"
          description: "The verification result. A 200 with `intact: false` is the\
            \ answer to a successful verification that found a break — not an error."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Recompute every hash in this organisation's chain
      tags:
      - Audit trail
  /api/auth/login:
    post:
      description: |-
        On success the reply carries a signed token to send as `Authorization: Bearer <token>` on subsequent requests. The token carries the tenant, which is why no endpoint takes one as a parameter.

        Every failure — unknown account, wrong password, or an account in a tenant this caller cannot reach — returns the same `401` with the same body. Distinguishing them would turn this endpoint into an account-enumeration oracle.

        No permission is required.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Signed in.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request body could not be read.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The credentials were not accepted. The reply is identical\
            \ whether the account does not exist, the password is wrong, or the account\
            \ is locked."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request omitted a username or a password.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Too many attempts. `Retry-After` gives the seconds to wait.\
            \ Rate limits apply per account and per source address, so this does not\
            \ confirm that the named account exists."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Sign-in failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      security: []
      summary: Exchange a username and password for a token
      tags:
      - Authentication
  /api/auth/register:
    post:
      description: |-
        Self-service registration, in one of two shapes.

        **With no invitation** the account gets a **new tenant of its own**, and the registrant administers it — somebody has to be able to invite the second person, and in a one-member organisation there is nobody else to grant that. The authority covers nothing but what the caller is about to create.

        **With an invitation** the account joins the tenant that issued it, with the role the inviting administrator chose. The invited email address must match the one in this request, so a forwarded invitation does not admit whoever received it.

        A tenant still cannot be named directly, and neither can a role: this endpoint requires no credential, so anything it accepts is something a stranger can assert about themselves. The reply states the role actually assigned.

        A deployment may set `cde.tenancy.self-registration` to `INVITATION_ONLY` or `DISABLED`, in which case the uninvited cases above return `403`.

        No permission is required — this endpoint is how a caller gets one.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: "The account was created, and the reply carries a token for\
            \ it — no separate sign-in is needed."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request body could not be read.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Self-service registration is closed on this deployment, or\
            \ it requires an invitation and none was presented."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The username or the email address is already in use. The reply\
            \ does not say which, so this cannot be used to test whether a given person\
            \ has an account here."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The details failed validation — most often a password shorter\
            \ than the tenant's minimum, or one found in a known-breached set. Also\
            \ returned when an invitation is unknown, expired, revoked, already redeemed,\
            \ or issued to a different address; those are one answer, because distinguishing\
            \ them tells a caller whether a guessed token is real."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many registrations from this source. `Retry-After` gives
            the seconds to wait.
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Registration failed for a reason the caller cannot act on.
            Quote the `traceId` when reporting it.
      security: []
      summary: "Create an account, in a new organisation or an inviting one"
      tags:
      - Authentication
