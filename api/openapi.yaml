          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No revision with that id is visible to the caller.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Read a revision's transition history
      tags:
      - Common Data Environment
    post:
      description: |-
        The only way a revision's state changes. Which moves are legal depends on where it is now:

        - **work in progress** may be shared, or archived if the work is abandoned;
        - **shared** may be published, rejected back to work in progress, or archived;
        - **published** may only be archived, which happens as part of being superseded;
        - **archived** is terminal.

        Anything else returns `409` with a message naming both states.

        Each target state requires its own permission — `container:share`, `container:publish`, `container:reject` or `container:archive` — and the check is made against the state actually requested, not against the endpoint. Holding one of them is enough to reach the endpoint; it is not enough to make a move you lack the permission for.

        Publishing records the caller as the authorising party and the reason as the authorisation. From that point the revision's content is frozen: the database refuses any edit or deletion, and the way to change published information is a new revision that supersedes it.
      operationId: transitionContainerRevision
      parameters:
      - description: Identifier of the revision.
        example: 2049
        in: path
        name: revisionId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionTransitionResult"
          description: "The revision after the change, and the transition recorded\
            \ for it."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No revision with that id is visible to the caller.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The state machine does not allow that move from the revision's
            current state.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request failed validation — a missing target state, or\
            \ a blank reason."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Move a revision to a new state
      tags:
      - Common Data Environment
