openapi: 3.1.0
info:
  contact:
    name: CDE Platform engineering
  description: |
    Common Data Environment API for construction and asset information.

    ## Tenant scoping

    Every request is scoped to exactly one tenant, and the tenant is taken **from the authenticated principal** — never from a path, query, header, or body parameter. There is no tenant selector on any endpoint, and supplying one has no effect. A resource belonging to another tenant is not visible: reading it by id returns `404`, not `403`, so the API does not confirm that an id exists somewhere else.

    ## Errors

    Every error response is an RFC 9457 Problem Details document with the media type `application/problem+json`. It carries a `traceId` that identifies the request in the server logs — quote it when reporting a problem. The `type` member is a stable relative URI identifying the kind of failure, and is safe to branch on when the status code alone is too coarse; `detail` is human-readable text whose wording may change, and is not.

    Validation failures return `422` with an `invalidFields` array naming each rejected field. A request body that cannot be parsed at all returns `400`, because no field can be named.

    ## Rate limits

    Responses carry `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`. A request that exceeds a limit returns `429` with `Retry-After` in seconds. Limits apply per account, per source address and per tenant independently, so a `429` does not necessarily mean this account was the one being noisy.

    ## Tracing

    Every response carries `X-Trace-Id`. Send a W3C `traceparent` header and its trace id is adopted, so a client-side trace and the server-side logs share one identifier.
  license:
    name: Proprietary
  title: CDE Platform API
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost
security:
- bearerAuth: []
tags:
- description: "Registration, sign-in and the session lifecycle."
  name: Authentication
- description: "Who is inside the organisation. An invitation is the only way an account\
    \ is created in a tenant the caller does not already belong to: registration refuses\
    \ to take a tenant identifier from an unauthenticated request, so an invitation\
    \ issued from inside is proof rather than an assertion."
  name: Organisation membership
- description: "This organisation's append-only, hash-chained record of security-relevant\
    \ events. Each record carries the SHA-256 of the record before it, and the sequence\
    \ numbers are contiguous, so an alteration breaks every hash after it and a removal\
    \ leaves a gap. Both hashes are returned so that an organisation can verify the\
    \ chain itself rather than being told it verified."
  name: Audit trail
- description: Projects group documents and carry the ownership and phase a document
    inherits.
  name: Projects
- description: "Information containers, their revisions and the gated transitions\
    \ between work in progress, shared, published and archived. A container's identity\
    \ is separate from any revision of its content, and a published revision is never\
    \ edited — it is superseded by a new one and archived, with the lineage kept."
  name: Common Data Environment
- description: "Upload, download, metadata and deletion of documents held in a project."
  name: Documents
- description: "The revision history of a document. Every operation that rewrites\
    \ a document commits a version, and earlier versions stay retrievable."
  name: Document versions
- description: "Markup laid over a document — shapes, comments, review status and\
    \ replies."
  name: Annotations
- description: "Operations that rewrite a document: conversion, OCR, redaction, watermarking,\
    \ form filling and flattening. Each commits a new version rather than editing\
    \ in place."
  name: Document processing
- description: "Reordering, rotating, deleting, inserting and extracting pages."
  name: Page manipulation
- description: "PAdES digital signatures applied to a document version, and their\
    \ verification."
  name: Digital signatures
- description: "Rendering, text extraction and search for the document viewer."
  name: Viewer
- description: "Model geometry, hierarchy and properties. The structured hierarchy\
    \ is the primary interface; the rendered view is a layer over it."
  name: 3D and model viewer
- description: Difference between two documents or two versions of one document.
  name: Document comparison
- description: "Presence and live editing state. The transport is STOMP over WebSocket;\
    \ these endpoints describe the session, not the message stream."
  name: Collaboration
- description: Assisted document understanding. Subject to the per-tenant kill switch
    and disabled by default on sovereign deployments.
  name: Assistance
- description: Client-side error reporting and service status.
  name: Diagnostics
paths:
  /api/ai/availability:
    get:
      description: |-
        Reports whether a model provider is configured and permitted on this deployment, so a client can hide the feature rather than offer one that will be refused.

        It is `false` on any government or Defence deployment regardless of configuration: those tiers make no outbound calls, and the check is not something a tenant administrator can override.

        Requires authentication.
      operationId: getAssistanceAvailability
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistanceAvailability"
          description: Whether the feature can be used.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Whether this deployment offers assisted summaries
      tags:
      - Assistance
  /api/ai/comparison-report:
    post:
      description: |-
        Turns the differences between two revisions into a structured review report.

        **The request carries facts, not a prompt.** The prompt, the model and the token ceiling are all decided on the server. This matters for more than tidiness: the outbound payload is built from an allow-list of named fields, so a field added to a comparison later does not travel to a third party until somebody decides it should.

        Before anything is sent, the selected fields are scanned. Personal identifiers — email addresses, telephone numbers, addresses in URLs — are replaced with stable placeholders and put back locally on the way home, so the provider never sees them. Content carrying a **classification marking is refused outright** rather than redacted: there is no redaction that makes such material safe to send, and a partial send is still a send.

        Every call is recorded in the audit trail — who, when, which model and provider, and whether redaction fired. The prompt and the reply are never recorded.

        Requires authentication.
      operationId: summariseComparison
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonReportRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonReportResponse"
          description: The report.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The content carries a classification marking and will not\
            \ be sent to a third party. The reply names which field, never its contents."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No provider is configured, or this deployment tier makes no\
            \ outbound calls, or the provider could not be reached."
      summary: Produce a review report for a comparison
      tags:
      - Assistance
  /api/annotations:
    post:
      description: |-
        The author is the authenticated caller and cannot be supplied. New markup starts `OPEN`.

        Everyone viewing the document is notified over the collaboration channel, so a second reviewer sees the markup without reloading.

        Requires the `annotation:write` permission.
      operationId: createAnnotation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
          description: The markup as created.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No document with that id is visible to the caller.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The markup failed validation — no shape data, or a page number\
            \ below 1."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Place markup on a document
      tags:
      - Annotations
  /api/annotations/document/{documentId}:
    get:
      description: |-
        Returns every piece of markup on the document, open and resolved alike, in creation order. Filtering to open items is left to the client because a review panel usually wants both, with the resolved ones collapsed.

        Requires the `annotation:read` permission.
      operationId: listAnnotationsByDocument
      parameters:
      - description: Identifier of the document.
        example: 1180
        in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnotationResponse"
          description: The markup on the document.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No document with that id is visible to the caller.
        "429":
          content:
            application/problem+json:
