      tags:
      - Documents
  /api/documents/upload/chunk:
    post:
      description: |-
        Chunks may arrive in any order. Each is acknowledged with a count of what has arrived so far; the chunk that completes the set assembles the file and returns the created document instead, so a client tells completion from progress by the shape of the reply.

        The upload identifier is chosen by the client, and an upload is scoped to the tenant that sent it: two tenants using the same identifier do not share chunks, cannot see each other's, and cannot complete or contaminate each other's file. Within one tenant it should still be unique per upload, because there it does identify the upload.

        Re-sending a chunk replaces it, so an interrupted upload can be resumed by repeating whatever did not arrive.

        Limits, all configurable per deployment: at most 4096 chunks, 8 MB per chunk, and 2 GB assembled. A chunk index outside the declared total, or a total outside that range, is refused with `422`. Chunks of an upload nothing has added to for 24 hours are deleted.

        Requires the `document:write` permission on the target project.
      operationId: uploadDocumentChunk
      parameters:
      - description: Client-chosen identifier tying the chunks of one upload together.
        example: 0d4c1f8e-2b7a-4c31-9de6-5a0b83f27c14
        in: query
        name: uploadId
        required: true
        schema:
          type: string
      - description: Zero-based index of this chunk within the file.
        example: 6
        in: query
        name: chunkIndex
        required: true
        schema:
          type: integer
          format: int32
      - description: How many chunks the file was split into.
        example: 12
        in: query
        name: totalChunks
        required: true
        schema:
          type: integer
          format: int32
      - description: "Name of the file being uploaded, kept as metadata only."
        example: RVD-XX-02-DR-A-1200.pdf
        in: query
        name: fileName
        required: true
        schema:
          type: string
      - description: Project to file the document under. Required on the last chunk.
        example: 42
        in: query
        name: projectId
        required: false
        schema:
          type: integer
          format: int64
      - description: Display name. Defaults to the file name without its extension.
        example: GA Plan — Level 02
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: What kind of document this is.
        example: DRAWING
        in: query
        name: documentType
        required: false
        schema:
          type: string
          default: DRAWING
      - description: Revision identifier as the originator issued it.
        example: P02.1
        in: query
        name: revision
        required: false
        schema:
          type: string
      - description: Drawing number from the title block.
        example: RVD-XX-02-DR-A-1200
        in: query
        name: drawingNumber
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chunk:
                  type: string
                  format: binary
                  description: This chunk's bytes.
              required:
              - chunk
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkAccepted"
          description: The chunk was stored; more are expected.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
          description: That was the last chunk. The file was assembled and the document
            created.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No project with that id is visible to the caller.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A required part is missing, the chunk index is outside the\
            \ declared total, the total is outside the permitted range, the chunk\
            \ is over the per-chunk limit, or the upload has reached the maximum file\
            \ size. The `detail` names which, and the limit it exceeded."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Send one chunk of a large upload
      tags:
      - Documents
