          description: "Authenticated, but without the permission this operation requires."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Check whether the conversion service is reachable
      tags:
      - Viewer
  /api/viewer/{documentId}:
    get:
      description: |-
        Returns whatever suits the document's format: SVG markup for a drawing, a pointer to the bytes for a PDF, extracted geometry for a model, or an explanation of why it cannot be opened. Read the `type` member first — it decides the shape of the rest.

        Images and mesh formats (GLB, STL, OBJ, PLY, DAE) are returned as raw bytes with the matching content type rather than as JSON, so check the response's content type before parsing it. Office documents are converted and returned as PDF bytes.

        **A `200` does not mean the document opened.** The variants that report a problem — `error`, `dwg_binary`, `office_error`, `revit_binary`, `3d_error`, `unsupported` — are also returned with `200`. This is a defect kept for compatibility: every client branches on `type`, so correcting the status is a coordinated change on both sides.

        Requires the `document:read` permission.
      operationId: getViewerPayload
      parameters:
      - description: Identifier of the document to open.
        example: 1180
        in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerPayload"
            application/pdf:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary
            model/gltf-binary:
              schema:
                type: string
                format: binary
          description: "What the viewer needs, or a described reason it cannot open\
            \ the document."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No document with that id is visible to the caller.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Get what the viewer needs to open a document
      tags:
      - Viewer
  /api/viewer/{documentId}/flatten:
    post:
      description: |-
        Draws the supplied shapes into the document itself, so they are part of the page rather than an overlay this application knows about. Anyone opening the file elsewhere then sees the markup.

        Not reversible within the document, but the version before flattening stays downloadable from the version history.

        Requires the `document:process` permission.
      operationId: flattenAnnotations
      parameters:
      - description: Identifier of the document.
        example: 1180
        in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlattenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingResponse"
          description: The version the flattening committed.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No document with that id is visible to the caller.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The document is not a PDF, or the shapes could not be drawn."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The conversion service is not reachable. The request was fine
            and will succeed once it is back.
      summary: Bake markup into the page
      tags:
      - Document processing
  /api/viewer/{documentId}/pdf:
    get:
      description: |-
        The bytes of the document's current version, served inline for the viewer to render.

        Not cached: processing replaces the bytes behind this URL, so a cached response would show a version that no longer exists. The viewer passes the version in the query string for the same reason.

        Requires the `document:read` permission.
      operationId: getPdfBytes
      parameters:
      - description: Identifier of the document.
        example: 1180
        in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      - description: Version the client believes it is fetching. Present so a browser
          does not serve a superseded copy from cache; the current version is always
          what is returned.
        example: 3
        in: query
        name: v
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: The PDF's bytes.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such document, or its file is missing from storage."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The document is not a PDF.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Stream a PDF's bytes
      tags:
      - Viewer
  /api/viewer3d/{documentId}:
    get:
      description: |-
        IFC is extracted by the conversion service and returned as JSON. Mesh formats — GLB, glTF, OBJ, STL, PLY, DAE — are streamed as raw bytes with the matching content type and an `X-3D-Format` header, so check the content type before parsing. Revit files cannot be opened at all and report why.

        As with the document viewer, a problem is reported with `200` and a described payload rather than an error status. Read `success` and `type`.

        The structured hierarchy from `/tree` is the primary route to a model's information; this endpoint serves the visual layer over it.

        Requires the `document:read` permission.
      operationId: getModel
      parameters:
      - description: Identifier of the model document.
        example: 1212
        in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerPayload"
            model/gltf-binary:
              schema:
                type: string
                format: binary
          description: "The geometry, or a described reason it is unavailable."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No document with that id is visible to the caller.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Get a model's geometry
      tags:
      - 3D and model viewer
  /api/viewer3d/{documentId}/tree:
    get:
      description: |-
        The structured route to everything the model holds — the interface a keyboard or a screen reader uses, and the one a rendered canvas cannot replace. It supports the same navigation and selection the visual view does.

        **When the conversion service cannot be reached, a placeholder outline is returned instead of the model's real hierarchy**, and its root carries `synthetic: true`. It lists the element classes a model of this kind usually contains, not this model's contents. A client must not present it as the model's structure; check the flag.

        Requires the `document:read` permission.
      operationId: getModelTree
      parameters:
      - description: Identifier of the model document.
        example: 1212
        in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelTreeNode"
          description: "The hierarchy, rooted at the model. Check the root's `synthetic`\
            \ flag before treating it as the model's real structure."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
            \ not get that far."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No credential was presented, or the one presented is expired\
            \ or invalid."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Authenticated, but without the permission this operation requires."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No document with that id is visible to the caller.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A rate limit was exceeded. `Retry-After` gives the seconds\
            \ to wait. Limits apply per account, per source address and per tenant\
            \ independently."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Get a model's hierarchy as a navigable tree
      tags:
      - 3D and model viewer
components:
  schemas:
    AddFieldsRequest:
      type: object
      description: Fields to place on the document.
      properties:
        fields:
          type: array
          description: The fields to add.
          items:
            $ref: "#/components/schemas/FieldRequest"
          minItems: 1
      required:
      - fields
    AnnotationRequest:
      type: object
      description: Markup to place on a document.
      properties:
        comment:
          type: string
          description: Note attached to the markup.
          example: Confirm slab level against structural drawing.
          maxLength: 4000
          minLength: 0
        documentId:
          type: integer
          format: int64
          description: Document the markup belongs to.
          example: 1180
        pageNumber:
          type: integer
          format: int32
          description: One-based page the markup sits on. Omitted for markup on a
            single-page document.
          example: 3
          minimum: 1
        shapeData:
          type: string
          description: "Geometry and styling, as a JSON object encoded in a string.\
            \ Its members depend on `type`, which is why it is carried opaquely rather\
            \ than as a union the schema would have to enumerate and keep in step\
            \ with the viewer."
          example:
            x: 120.5
            "y": 338.0
            width: 210.0
            height: 18.0
            colour: "#ffd400"
          maxLength: 65535
          minLength: 0
        type:
          type: string
          description: "What kind of markup this is, which decides how it is drawn."
          enum:
          - COMMENT
          - MARKUP
          - DIMENSION
          - CLOUD
          - ARROW
          - STAMP
          - HIGHLIGHT
          - UNDERLINE
          - STRIKEOUT
          - SQUIGGLY
          example: HIGHLIGHT
      required:
      - documentId
      - shapeData
      - type
    AnnotationResponse:
      type: object
      description: Markup as stored.
      properties:
        author:
          type: string
          description: Sign-in name of the account that created it.
          example: j.okafor
          readOnly: true
        comment:
          type: string
          description: Note attached to the markup.
          example: Confirm slab level against structural drawing.
        createdAt:
          type: string
          format: date-time
          description: "When the markup was created, UTC."
          example: 2026-02-19T13:47:02
          readOnly: true
        documentId:
          type: integer
          format: int64
          description: Document the markup belongs to.
          example: 1180
        id:
          type: integer
          format: int64
          description: Identifier of the markup.
          example: 9042
          readOnly: true
        pageNumber:
          type: integer
          format: int32
          description: One-based page the markup sits on.
          example: 3
          minimum: 1
        shapeData:
          type: string
          description: "Geometry and styling, as a JSON object encoded in a string."
          example:
            x: 120.5
            "y": 338.0
            width: 210.0
            height: 18.0
            colour: "#ffd400"
        status:
          type: string
          description: Whether the point raised has been dealt with.
          enum:
          - OPEN
          - RESOLVED
          - CLOSED
          example: OPEN
        type:
          type: string
          description: What kind of markup this is.
          enum:
          - COMMENT
          - MARKUP
          - DIMENSION
          - CLOUD
          - ARROW
          - STAMP
          - HIGHLIGHT
          - UNDERLINE
          - STRIKEOUT
          - SQUIGGLY
          example: HIGHLIGHT
      required:
      - createdAt
      - documentId
      - id
      - shapeData
      - status
      - type
    ArrangeRequest:
      type: object
      description: "The page layout wanted, in order. Every page of the result must\
        \ appear; pages left out are deleted, and a page listed twice is duplicated."
      properties:
        pages:
          type: array
          description: "The wanted layout, in order."
          items:
            $ref: "#/components/schemas/PageEntry"
          minItems: 1
      required:
      - pages
    AssistanceAvailability:
      type: object
      description: Whether assisted summaries can be used on this deployment.
      properties:
        available:
          type: boolean
          description: "False on any deployment that makes no outbound calls, and\
            \ on any with no provider configured."
          example: true
      required:
      - available
    AuditChainVerificationResponse:
      type: object
      description: The result of recomputing every hash in this organisation's chain.
      properties:
        firstBrokenAt:
          type:
          - integer
          - "null"
          format: int64
          description: "The sequence number where verification stopped, or null when\
            \ the chain is intact."
          example: 97
        intact:
          type: boolean
          description: True when every record follows from the one before it.
          example: true
        reason:
          type:
          - string
          - "null"
          description: "What was wrong, in words, or null when the chain is intact."
          example: the record's contents do not match its hash
        recordsChecked:
          type: integer
          format: int32
          description: How many records were read.
          example: 1420
      required:
      - intact
      - recordsChecked
    AuthResponse:
      type: object
      description: A signed session. The token carries the subject and the tenant;
        the tenant claim is authoritative and cannot be overridden by any request
        parameter.
      properties:
        role:
          type: string
          description: Role the account holds. Client-side use is presentation only
            — every permission is re-checked server-side on every request.
          example: ENGINEER
        token:
          type: string
          description: "Signed JSON Web Token, sent on subsequent requests as `Authorization:\
            \ Bearer <token>`."
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJqLm9rYWZvciJ9.c3ludGhldGljLXNpZ25hdHVyZQ
        username:
          type: string
          description: Sign-in name the token authenticates.
          example: j.okafor
      required:
      - role
      - token
      - username
    ChunkAccepted:
      type: object
      description: Acknowledgement of one chunk of a chunked upload. Returned for
        every chunk except the last; the last returns the created document instead.
      properties:
        received:
          type: integer
          format: int32
          description: "How many distinct chunks have arrived so far. Chunks may arrive\
            \ out of order, so this is a count and not a high-water mark."
          example: 7
          minimum: 1
        total:
          type: integer
          format: int32
          description: How many chunks the client said it would send.
          example: 12
          minimum: 1
        uploadId:
          type: string
          description: "Identifier the client generated for this upload, echoed back\
            \ so a concurrent upload's acknowledgement cannot be mistaken for this\
            \ one."
          example: 0d4c1f8e-2b7a-4c31-9de6-5a0b83f27c14
      required:
      - received
      - total
      - uploadId
    ClientErrorReport:
      type: object
      description: |-
        An error the browser hit, forwarded so it can be correlated with the server-side logs for the same session.

        Nothing here is trusted. Every member is length-bounded and stripped of control characters before it reaches a log, because a caller that could embed a line break could forge log entries.
      properties:
        level:
          type: string
          description: How serious the client considered it.
          enum:
          - error
          - warning
          - info
          example: error
          maxLength: 16
          minLength: 0
        message:
          type: string
          description: What went wrong.
          example: Cannot read properties of undefined
          maxLength: 2000
          minLength: 0
        timestamp:
          type: string
          format: date-time
          description: "When the client recorded it, UTC. The server records its own\
            \ arrival time regardless, so a client with a wrong clock cannot misplace\
            \ the entry."
          example: 2026-02-21T11:58:03.221Z
          maxLength: 40
          minLength: 0
        type:
          type: string
          description: "What kind of failure it was, as the client classified it."
          example: http-error
          maxLength: 60
          minLength: 0
        url:
          type: string
          description: "Route the browser was on. A path, not a full URL — a full\
            \ URL can carry query parameters that hold personal data."
          example: /projects/42/documents/1180
          maxLength: 512
          minLength: 0
      required:
      - level
      - message
    CompareRequest:
      type: object
      description: The two documents to compare.
      properties:
        documentId1:
          type: integer
          format: int64
          description: "The earlier document, shown as the left-hand side."
          example: 1180
        documentId2:
          type: integer
          format: int64
          description: "The later document, shown as the right-hand side."
          example: 1195
      required:
      - documentId1
      - documentId2
    ComparisonReportRequest:
      type: object
      description: "The facts to summarise. Deliberately not a prompt: the prompt\
        \ is built on the server from these fields, which is what makes an allow-list\
        \ possible."
      properties:
        changes:
          type: array
          description: "The changes detected, one per entry. At most 40 are sent;\
            \ the rest are summarised by count."
          example:
          - Door schedule updated on grid line C
          items:
            type: string
            maxLength: 400
            minLength: 0
          maxItems: 500
          minItems: 0
        documentKind:
          type: string
          description: What kind of document was compared.
          example: drawing
          maxLength: 64
          minLength: 0
        firstDocumentName:
          type: string
          description: Name of the earlier revision's document.
          example: GA Plan — Level 02
          maxLength: 400
          minLength: 0
        firstRevision:
          type: string
          description: Revision identifier of the earlier document.
          example: P01
          maxLength: 400
          minLength: 0
        secondDocumentName:
          type: string
          description: Name of the later revision's document.
          example: GA Plan — Level 02
          maxLength: 400
          minLength: 0
        secondRevision:
          type: string
          description: Revision identifier of the later document.
          example: P02
          maxLength: 400
          minLength: 0
      required:
      - changes
      - documentKind
      - firstDocumentName
      - firstRevision
      - secondDocumentName
      - secondRevision
    ComparisonReportResponse:
      type: object
      description: The assisted review report.
      properties:
        report:
          type: string
          description: "The report, in five sections. Any placeholder the provider\
            \ saw has been replaced with the real value before this reply was assembled."
          example: Revision summary\nThe door schedule was revised...
      required:
      - report
    ComparisonResponse:
      type: object
      description: "The difference between two documents. The comparison itself is\
        \ produced by the conversion service and its members vary with the document\
        \ kinds being compared, so the shape carries the metadata this API adds plus\
        \ whatever the comparison produced."
      properties:
        comparison:
          type: object
          additionalProperties: {}
          description: "The comparison itself — page images, changed regions, or a\
            \ textual diff, depending on what was compared."
          example:
            pagesCompared: 14
            pagesChanged:
            - 3
            - 7
        doc1FileName:
          type: string
          description: File name of the first document.
          example: RVD-XX-02-DR-A-1200_P01.pdf
        doc1Name:
          type: string
          description: Name of the first document.
          example: GA Plan — Level 02
        doc1Revision:
          type: string
          description: Revision of the first document.
          example: P01
        doc2FileName:
          type: string
          description: File name of the second document.
          example: RVD-XX-02-DR-A-1200_P02.pdf
        doc2Name:
          type: string
          description: Name of the second document.
          example: GA Plan — Level 02
        doc2Revision:
          type: string
          description: Revision of the second document.
          example: P02
        error:
          type: string
          description: Why no comparison was produced. Present only when `success`
            is false.
          example: The conversion service is not running.
        success:
          type: boolean
          description: Whether a comparison was produced.
          example: true
      required:
      - success
    ContainerRequest:
      type: object
      description: "The identity of a piece of project information, independent of\
        \ any revision of its content."
      properties:
        containerReference:
          type: string
          description: "The assembled, delimited identifier people read and search\
            \ on. The field pattern and delimiter are the project's own convention,\
            \ so this is validated for length and uniqueness here rather than against\
            \ a shipped format."
          example: PRJ-XYZ-ZZ-00-DR-A-0001
          maxLength: 255
          minLength: 0
        namingFields:
          type: object
          additionalProperties:
            type: string
          description: "The individual naming fields, keyed by the name the project's\
            \ convention gives each one. Free-form because the field set differs between\
            \ organisations; omit it and the reference stands alone."
          example:
            project: PRJ
            originator: XYZ
            volume: ZZ
            level: "00"
            type: DR
            role: A
            number: "0001"
      required:
      - containerReference
    ContainerResponse:
      type: object
      description: |-
        A container as stored.

        There is no state on a container, and that is not an omission: state belongs to its revisions, and a container in normal use has several at once — a published revision that is the current contractual record, and a work-in-progress revision that will supersede it. Reporting a single state here would have to pick one of them and would misrepresent the other.
      properties:
        containerReference:
          type: string
          description: "The assembled, delimited identifier."
          example: PRJ-XYZ-ZZ-00-DR-A-0001
        createdAt:
          type: string
          format: date-time
          description: "When the container was created, in the server's time zone."
          example: 2026-03-04T09:15:00
        createdBy:
          type: string
          description: Username of whoever created the container.
          example: a.surveyor
        id:
          type: integer
          format: int64
          description: Identifier of the container.
          example: 1024
        namingFields:
          type: object
          additionalProperties:
            type: string
          description: The individual naming fields as supplied.
          example:
            project: PRJ
            originator: XYZ
            volume: ZZ
            level: "00"
            type: DR
            role: A
            number: "0001"
        projectId:
          type: integer
          format: int64
          description: The project the container belongs to.
          example: 42
    ContainerTransitionResponse:
      type: object
      description: "One recorded state change: who moved a revision, from what to\
        \ what, when, and why. Append-only — the application holds no grant to rewrite\
        \ or remove one."
      properties:
        fromState:
          type: string
          description: The state the revision was in.
          enum:
          - WORK_IN_PROGRESS
          - SHARED
          - PUBLISHED
          - ARCHIVED
          example: WORK_IN_PROGRESS
        id:
          type: integer
          format: int64
          description: Identifier of the transition record.
          example: 8801
        performedAt:
          type: string
          format: date-time
          description: When it was performed.
          example: 2026-03-06T11:02:00
        performedBy:
          type: string
          description: Username of whoever performed the transition.
          example: a.surveyor
        reason:
          type:
          - string
          - "null"
          description: The reason given.
          example: Issued for coordination.
        toState:
          type: string
          description: The state it moved to.
          enum:
          - WORK_IN_PROGRESS
          - SHARED
          - PUBLISHED
          - ARCHIVED
          example: SHARED
    ConverterStatusResponse:
      type: object
      description: "Whether the document conversion service is reachable. The viewer\
        \ asks before offering conversion-dependent actions, so it can say why something\
        \ is unavailable rather than failing when it is tried."
      properties:
        running:
          type: boolean
          description: Whether the conversion service answered.
          example: true
      required:
      - running
    DocumentResponse:
      type: object
      description: "A document's metadata. The file itself is fetched separately,\
        \ so a listing never carries content."
      properties:
        createdAt:
          type: string
          format: date-time
          description: "When the document was uploaded, UTC."
          example: 2026-02-02T09:14:38
          readOnly: true
        description:
          type: string
          description: Free text about this document.
          example: Issued for coordination.
        documentType:
          type: string
          description: "What kind of document this is, which decides how the viewer\
            \ opens it."
          enum:
          - DRAWING
          - SPECIFICATION
          - REPORT
          - SCHEDULE
          - BIM_MODEL
          - POINT_CLOUD
          - OTHER
          example: DRAWING
        drawingNumber:
          type: string
          description: Drawing number as it appears in the title block.
          example: RVD-XX-02-DR-A-1200
        fileName:
          type: string
          description: "Name of the uploaded file, kept for display and for the download\
            \ header. It is never used as a storage path — the stored name is generated\
            \ server-side."
          example: RVD-XX-02-DR-A-1200.pdf
          readOnly: true
        fileSize:
          type: integer
          format: int64
          description: Size of the current version in bytes.
          example: 4718592
          minimum: 0
          readOnly: true
        fileType:
          type: string
          description: Media type detected from the file's own content rather than
            from its extension or the browser's claim.
          example: application/pdf
          readOnly: true
        id:
          type: integer
          format: int64
          description: Identifier of the document.
          example: 1180
          readOnly: true
        name:
          type: string
          description: "Display name, chosen at upload and independent of the file\
            \ name."
          example: GA Plan — Level 02
        projectId:
          type: integer
          format: int64
          description: Identifier of the project holding this document.
          example: 42
        revision:
          type: string
          description: Revision identifier as the originator issued it.
          example: P02.1
        sheetNumber:
          type: string
          description: Sheet number where the drawing spans several sheets.
          example: 2 of 6
        status:
          type: string
          description: Review state of the document.
          enum:
          - DRAFT
          - IN_REVIEW
          - APPROVED
          - SUPERSEDED
          - VOID
          example: DRAFT
        updatedAt:
          type: string
          format: date-time
          description: "When the document or its metadata last changed, UTC."
          example: 2026-02-19T13:47:02
          readOnly: true
        uploadedBy:
          type: string
          description: Sign-in name of the account that uploaded it.
          example: j.okafor
          readOnly: true
      required:
      - createdAt
      - documentType
      - id
      - name
      - projectId
      - status
    DocumentVersionResponse:
      type: object
      description: "One entry in a document's history. Every operation that rewrites\
        \ a document commits one of these, and every earlier entry stays downloadable."
      properties:
        contentHash:
          type: string
          description: "SHA-256 of this version's bytes, so a downloaded copy can\
            \ be checked against what the server holds."
          example: 9f2c4b7e1a8d3f60c5b2e9a47d18f3c06b5e2a91d7f4c308b6a1e5d9c2f70348
          pattern: "^[0-9a-f]{64}$"
        createdAt:
          type: string
          format: date-time
          description: "When this version was committed, UTC."
          example: 2026-02-21T10:33:09
          readOnly: true
        createdBy:
          type: string
          description: Sign-in name of the account that committed it.
          example: j.okafor
          readOnly: true
        current:
          type: boolean
          description: Whether this is the version the document currently serves.
          example: false
        fileName:
          type: string
          description: File name this version was written under.
          example: RVD-XX-02-DR-A-1200.pdf
        fileSize:
          type: integer
          format: int64
          description: Size of this version in bytes.
          example: 4721664
          minimum: 0
        operation:
          type: string
          description: What produced this version.
          enum:
          - UPLOAD
          - REDACT
          - OCR
          - FLATTEN
          - FORM_FILL
          - FORM_DESIGN
          - PAGES
          - SIGN
          - RESTORE
          example: REDACT
        summary:
          type: string
          description: "What changed, in one line, written for the history panel."
          example: Redacted 6 regions across 2 pages.
        version:
          type: integer
          format: int32
          description: "Version number, counting from 1 for the original upload."
          example: 3
          minimum: 1
      required:
      - createdAt
      - current
      - operation
      - summary
      - version
    ExtractRequest:
      type: object
      description: Pages to copy into a new document.
      properties:
        name:
          type: string
          description: Name for the new document. Derived from the source's name and
            the page range when omitted.
          example: GA Plan — Level 02 (pages 3–5)
          maxLength: 200
          minLength: 0
        pages:
          type: array
          description: "One-based pages to extract, in the order they should appear."
          example:
          - 3
          - 4
          - 5
          items:
            type: integer
            format: int32
          minItems: 1
      required:
      - pages
    FieldRequest:
      type: object
      description: One field to place. Coordinates are PDF points with a bottom-left
        origin.
      properties:
        height:
          type: number
          format: float
          description: "Height of the field, in points."
          example: 18.0
          minimum: 0
        kind:
          type: string
          default: TEXT
          description: What kind of control to place.
          enum:
          - TEXT
          - TEXTAREA
          - CHECKBOX
          - DROPDOWN
          example: TEXT
        name:
          type: string
          description: Name to address the field by when filling it. Must be unique
            within the document.
          example: contractor_name
          maxLength: 120
          minLength: 0
        options:
          type: array
          description: Choices offered. Meaningful for `DROPDOWN` only.
          example:
          - Structural
          - Architectural
          - Services
          items:
            type: string
        page:
          type: integer
          format: int32
          default: 1
          description: One-based page to place it on.
          example: 1
          minimum: 1
        required:
          type: boolean
          default: false
          description: Whether the field must be filled before the form is complete.
          example: true
        width:
          type: number
          format: float
          description: "Width of the field, in points."
          example: 220.0
          minimum: 0
        x:
          type: number
          format: float
          description: "Distance from the left edge, in points."
          example: 72.0
        "y":
          type: number
          format: float
          description: "Distance from the bottom edge, in points."
          example: 540.0
      required:
      - name
    FlattenRequest:
      type: object
      description: Shapes to draw into the document.
      properties:
        quality:
          type: string
          default: screen
          description: Rendering quality. `print` keeps more detail and produces a
            larger file; anything else is treated as `screen`.
          enum:
          - screen
          - print
          example: screen
        shapes:
          type: array
          description: "The shapes to draw, in the viewer's own geometry format. Carried\
            \ opaquely because the members depend on each shape's type, which the\
            \ viewer owns."
          example:
          - type: rect
            page: 1
            x: 80
            "y": 420
            width: 180
            height: 40
            colour: "#d32f2f"
          items:
            type: object
            additionalProperties: {}
          minItems: 1
      required:
      - shapes
    FormChangeResponse:
      type: object
      description: The version a form-design change committed.
      properties:
        documentId:
          type: integer
          format: int64
          description: Document whose form changed.
          example: 1180
        fields:
          type: array
          description: "Names of the fields added or removed, in the order they were\
            \ processed."
          example:
          - contractor_name
          - inspection_date
          items:
            type: string
        success:
          type: boolean
          description: Always true. A failure returns a problem document instead.
          example: true
        summary:
          type: string
          description: "What changed, in one line."
          example: Added 4 fields on page 1.
        version:
          type: integer
          format: int32
          description: Version number this change committed.
          example: 5
          minimum: 1
      required:
      - documentId
      - fields
      - success
      - summary
      - version
    FormFieldDescription:
      type: object
      description: "One interactive field on a form. Members beyond the common ones\
        \ depend on the field's kind: a checkbox carries `onState` and `checked`,\
        \ a dropdown carries `options` and `multiSelect`, a text field carries `multiline`\
        \ and possibly `maxLength`."
      properties:
        checked:
          type: boolean
          description: Whether a checkbox is currently ticked. Checkboxes only.
          example: false
        flags:
          type: integer
          format: int32
          description: "PDF field flags, as a bit set. Present for diagnosis; the\
            \ derived members above are what a client should read."
          example: 0
        kind:
          type: string
          description: "Kind of control, normalised across the several ways a PDF\
            \ can express the same thing."
          enum:
          - text
          - textarea
          - password
          - checkbox
          - radio
          - dropdown
          - listbox
          - signature
          - button
          example: text
        maxLength:
          type: integer
          format: int32
          description: "Character limit the document imposes. Text fields only, and\
            \ only when the document sets one."
          example: 120
          minimum: 1
        multiSelect:
          type: boolean
          description: Whether a list accepts more than one choice. Choice fields
            only.
          example: false
        multiline:
          type: boolean
          description: Whether a text field accepts line breaks. Text fields only.
          example: false
        name:
          type: string
          description: "Field name as held in the document, used to address it when\
            \ filling."
          example: contractor_name
        onState:
          type: string
          description: Value a checkbox takes when ticked. Checkboxes only.
          example: /Yes
        options:
          type: array
          description: Choices a dropdown or list offers. Choice fields only.
          example:
          - Structural
          - Architectural
          - Services
          items:
            type: string
        page:
          type: integer
          format: int32
          description: One-based page the field sits on.
          example: 1
          minimum: 1
        readOnly:
          type: boolean
          description: Whether the field refuses input.
          example: false
        required:
          type: boolean
          description: Whether the field must be filled before the form is complete.
          example: true
        type:
          type: string
          description: Raw PDF field type.
          example: /Tx
        value:
          type: string
          description: "Current value, as text."
          example: (none)
      required:
      - kind
      - name
      - page
    FormFieldsResponse:
      type: object
      description: "The interactive fields a document carries, ordered by page and\
        \ then by name so a form UI does not reshuffle between requests."
      properties:
        error:
          type: string
          description: Why the document could not be inspected. Present only when
            `success` is false.
          example: File not found
        fields:
          type: array
          description: "The fields, in page-then-name order. Empty for a flat document."
          items:
            $ref: "#/components/schemas/FormFieldDescription"
        pageCount:
          type: integer
          format: int32
          description: How many pages the document has.
          example: 14
          minimum: 0
        success:
          type: boolean
          description: Whether the document could be inspected.
          example: true
      required:
      - success
    FormFillRequest:
      type: object
      description: Values to write into a document's form.
      properties:
        fields:
          type: object
          additionalProperties: {}
          description: "Field name to value. A checkbox takes a boolean, a dropdown\
            \ one of its options, a text field a string. Fields not named are left\
            \ alone."
          example:
            contractor_name: Riverside Civils Ltd
            inspection_date: 2026-02-21
            defects_found: false
          minProperties: 1
        flatten:
          type: boolean
          default: false
          description: "Whether to bake the values in and drop the interactive fields,\
            \ making the form no longer editable."
          example: false
      required:
      - fields
    InsertRequest:
      type: object
      description: Pages to copy in from another document.
      properties:
        pages:
          type: array
          description: "One-based pages of the source to copy, in the order they should\
            \ appear."
          example:
          - 1
          - 2
          - 5
          items:
            type: integer
            format: int32
          minItems: 1
        position:
          type: integer
          format: int32
          description: One-based position in this document to insert before. Omit
            to append; a position past the end appends.
          example: 4
          minimum: 1
        sourceDocumentId:
          type: integer
          format: int64
          description: Document to copy the pages from. It is not modified.
          example: 1195
      required:
      - pages
      - sourceDocumentId
    InvitationRequest:
      type: object
      description: An offer to join the caller's own organisation. The tenant is taken
        from the caller's session and cannot be named here — an administrator may
        only invite people into the organisation they are inside.
      properties:
        email:
          type: string
          format: email
          description: "Address to invite. Registration must present this same address,\
            \ so a forwarded invitation does not admit whoever received it."
          example: n.dubois@example.test
          maxLength: 254
          minLength: 0
        role:
          type: string
          description: "Role the invitee receives on joining. Chosen by the inviting\
            \ administrator, never by the person redeeming the invitation."
          enum:
          - ADMIN
          - ENGINEER
          - REVIEWER
          - VIEWER
          example: ENGINEER
      required:
      - email
      - role
    InvitationResponse:
      type: object
      description: "An invitation as it appears in a listing. It carries no token\
        \ — that was shown once, at creation."
      properties:
        acceptedAt:
          type:
          - string
          - "null"
          format: date-time
          description: "When it was redeemed, or null if it has not been."
          example: 2026-08-27T11:02:00
        createdAt:
          type: string
          format: date-time
          description: When it was issued.
          example: 2026-08-26T09:15:00
        email:
          type: string
          format: email
          description: Address the invitation admits.
          example: n.dubois@example.test
        expiresAt:
          type: string
          format: date-time
          description: When it stops being redeemable.
          example: 2026-09-02T09:15:00
        id:
          type: integer
          format: int64
          description: Identifier.
          example: 17
        role:
          type: string
          description: Role the invitee receives.
          example: ENGINEER
        status:
          type: string
          description: Where it stands.
          enum:
          - PENDING
          - ACCEPTED
          - REVOKED
          - EXPIRED
          example: PENDING
      required:
      - createdAt
      - email
      - expiresAt
      - id
      - role
      - status
    IssuedInvitationResponse:
      type: object
      description: "A newly created invitation. This is the only time the token is\
        \ ever returned: it is stored as a SHA-256 hash and cannot be recovered, so\
        \ a lost one is reissued rather than looked up."
      properties:
        email:
          type: string
          format: email
          description: Address the invitation admits.
          example: n.dubois@example.test
        expiresAt:
          type: string
          format: date-time
          description: When it stops being redeemable.
          example: 2026-09-02T09:15:00
        id:
          type: integer
          format: int64
          description: "Identifier, for revoking it later."
          example: 17
        role:
          type: string
          description: Role the invitee will receive.
          example: ENGINEER
        token:
          type: string
          description: The invitation token. Send it to the invited address over a
            channel you trust — anyone holding it and that address can join the organisation.
          example: cdeinv_c3ludGhldGljLXNhbXBsZS10b2tlbi12YWx1ZQ
          readOnly: true
      required:
      - email
      - expiresAt
      - id
      - role
      - token
    LoginRequest:
      type: object
      description: Credentials for a password sign-in.
      properties:
        password:
          type: string
          format: password
          description: Password for the account.
          example: correct-horse-battery-staple-42
          minLength: 1
          writeOnly: true
        username:
          type: string
          description: Sign-in name.
          example: j.okafor
          maxLength: 60
          minLength: 1
      required:
      - password
      - username
    ModelPayload:
      type: object
      description: |-
        Geometry and hierarchy for an IFC model, as the conversion service produced it. Its remaining members are the service's own and vary with what the model contains, so they are carried opaquely rather than enumerated here — an enumeration would go stale the first time the extractor learned something new.

        The structured hierarchy is the primary interface; the rendered view is a layer over it.
      properties:
        geometry:
          type: object
          additionalProperties: {}
          description: "Geometry, hierarchy and properties, in the conversion service's\
            \ own format."
          example:
            meshes: 12
            storeys: 4
        success:
          type: boolean
          description: Whether the extraction produced usable geometry.
          example: true
        type:
          type: string
          description: Always `ifc3d`.
          enum:
          - ifc3d
          example: ifc3d
      required:
      - success
      - type
    ModelTreeNode:
      description: "One node of a model's hierarchy. The tree is the accessible route\
        \ to the model's information: it must support the same navigation, search\
        \ and selection the rendered view does, because a canvas on its own cannot."
      properties:
        children:
          type: array
          description: Elements contained by this one.
          items:
            $ref: "#/components/schemas/ModelTreeNode"
        expanded:
          type: boolean
          description: Whether a client should show this node's children initially.
          example: false
        id:
          type: string
          description: Identifier of this element within the model.
          example: 3Vw$Kq2Kn0zeF1yZ8bQwXt
        name:
          type: string
          description: Name to show for this element.
          example: Basic Wall — 215mm
        selected:
          type: boolean
          description: Whether this node is currently selected.
          example: false
        synthetic:
          type: boolean
          description: |-
            Set only on the root, and only when the hierarchy could not be extracted from the model itself — the conversion service was unreachable, so what is returned is a placeholder outline of the element classes a model of this kind usually contains, not this model's contents.

            Absent or false means the hierarchy came from the model. A client must not present a synthetic tree as the model's structure.
          example: true
        type:
          type: string
          description: The element's class in the source model.
          example: IfcWall
        visible:
          type: boolean
          description: Whether this element is currently shown in the rendered view.
          example: true
      required:
      - id
      - name
      - type
    OcrRequest:
      type: object
      description: "How to run recognition. Every member has a working default, so\
        \ an empty body is a valid request."
      properties:
        dpi:
          type: integer
          format: int32
          default: 300
          description: "Resolution to rasterise at before recognition. Below 150 accuracy\
            \ collapses; above 600 the extra memory buys nothing. A value outside\
            \ the range is clamped rather than refused, because a caller asking for\
            \ 1200 wants the best available and should not have to guess the limit."
          example: 300
          maximum: 600
          minimum: 150
        lang:
          type: string
          default: eng
          description: "Language to recognise, as a three-letter code. The language\
            \ pack must be installed on the conversion service."
          example: eng
          pattern: "^[a-z]{3}(\\+[a-z]{3})*$"
        skipTextPages:
          type: boolean
          default: true
          description: Whether to leave pages that already carry text alone. Recognising
            over real text replaces it with a guess at the same words.
          example: true
    PageArrangementResponse:
      type: object
      description: "The version a page change committed. Reordering, deleting, duplicating\
        \ and rotating all report through this shape, because a batch of edits commits\
        \ as one version described by its net effect."
      properties:
        createdAt:
          type: string
          format: date-time
          description: "When the version was committed, UTC."
          example: 2026-02-21T11:31:40
        documentId:
          type: integer
          format: int64
          description: Document whose pages changed.
          example: 1180
        pageCount:
          type: integer
          format: int32
          description: How many pages the document now has.
          example: 13
          minimum: 0
        success:
          type: boolean
          description: Always true. A failure returns a problem document instead.
          example: true
        summary:
          type: string
          description: "What changed, in one line."
          example: "Moved 2 pages, rotated 1, deleted 1."
        version:
          type: integer
          format: int32
          description: Version number this change committed.
          example: 6
          minimum: 1
      required:
      - createdAt
      - documentId
      - pageCount
      - success
      - summary
      - version
    PageDescription:
      type: object
      description: One page's size and orientation.
      properties:
        height:
          type: number
          format: double
          description: "Media box height in points, before rotation is applied."
          example: 595.3
          minimum: 0
        page:
          type: integer
          format: int32
          description: One-based page number.
          example: 1
          minimum: 1
        rotation:
          type: integer
          format: int32
          description: "Rotation the page declares, in degrees clockwise. A renderer\
            \ may already have applied this, which is why it is reported rather than\
            \ inferred from a thumbnail."
          example: 0
          maximum: 270
          minimum: 0
          multipleOf: 90.0
        width:
          type: number
          format: double
          description: "Media box width in points, before rotation is applied."
          example: 841.9
          minimum: 0
      required:
      - height
      - page
      - rotation
      - width
    PageEntry:
      type: object
      description: One page of the wanted layout.
      properties:
        page:
          type: integer
          format: int32
          description: One-based page in the document as it stands now.
          example: 3
          minimum: 1
        rotate:
          type: integer
          format: int32
          description: "Rotation to apply relative to the page's current one, in degrees\
            \ clockwise. Omit or send 0 to leave it as it is."
          example: 90
          maximum: 270
          minimum: 0
          multipleOf: 90.0
      required:
      - page
    PageExtractionResponse:
      type: object
      description: "The new document that extracting pages created. The source document\
        \ is unchanged — extraction copies, it does not move."
      properties:
        documentId:
          type: integer
          format: int64
          description: Identifier of the document that was created.
          example: 1204
        fileSize:
          type: integer
          format: int64
          description: Size of the new document in bytes.
          example: 918272
          minimum: 0
        name:
          type: string
          description: Name the new document was given.
          example: GA Plan — Level 02 (pages 3–5)
        pageCount:
          type: integer
          format: int32
          description: How many pages were extracted.
          example: 3
          minimum: 1
        success:
          type: boolean
          description: Always true. A failure returns a problem document instead.
          example: true
      required:
      - documentId
      - name
      - pageCount
      - success
    PageLayoutResponse:
      type: object
      description: How a document's pages are laid out. The page organiser needs this
        before it can offer to reorder or rotate anything.
      properties:
        error:
          type: string
          description: Why the document could not be read. Present only when `success`
            is false.
          example: File not found
        pageCount:
          type: integer
          format: int32
          description: How many pages the document has.
          example: 14
          minimum: 0
        pages:
          type: array
          description: "Each page, in document order."
          items:
            $ref: "#/components/schemas/PageDescription"
        success:
          type: boolean
          description: Whether the document could be read.
          example: true
      required:
      - success
    PageResponse:
      type: object
      description: "One page of a listing, with the counts needed to render a pager\
        \ without a second request."
      properties:
        content:
          type: array
          description: "The items on this page, in the requested order."
          items: {}
        first:
          type: boolean
          description: Whether this is the first page.
          example: true
        last:
          type: boolean
          description: Whether this is the last page.
          example: false
        number:
          type: integer
          format: int32
          description: Zero-based index of this page.
          example: 0
          minimum: 0
        size:
          type: integer
          format: int32
          description: Maximum items a page of this listing holds.
          example: 50
          minimum: 1
        totalElements:
          type: integer
          format: int64
          description: Total items across every page.
          example: 137
          minimum: 0
        totalPages:
          type: integer
          format: int32
          description: Total pages at the current page size.
          example: 3
          minimum: 0
      required:
      - content
      - first
      - last
      - number
      - size
      - totalElements
      - totalPages
    PdfPayload:
      type: object
      description: A PDF. The bytes are fetched separately so the viewer can stream
        them; this carries the pointer and the metadata around it.
      properties:
        drawingNumber:
          type: string
          description: "Drawing number from the title block, empty when none is held."
          example: RVD-XX-02-DR-A-1200
        fileName:
          type: string
          description: Name of the underlying file.
          example: RVD-XX-02-DR-A-1200.pdf
        name:
          type: string
          description: The document's display name.
          example: GA Plan — Level 02
        pdfUrl:
          type: string
          format: uri-reference
          description: "Where to fetch the bytes. The version is in the query string\
            \ because processing replaces the bytes behind a fixed URL, and without\
            \ it a browser would serve the previous version from cache."
          example: /api/viewer/1180/pdf?v=3
        revision:
          type: string
          description: "Revision identifier, empty when none is held."
          example: P02.1
        type:
          type: string
          description: Always `pdf`.
          enum:
          - pdf
          example: pdf
        version:
          type: integer
          format: int32
          description: Version the pointer refers to.
          example: 3
          minimum: 1
      required:
      - name
      - pdfUrl
      - type
      - version
    ProblemDetail:
      type: object
      description: "RFC 9457 Problem Details. The single error shape returned by every\
        \ endpoint, for every status."
      properties:
        detail:
          type: string
          description: "What happened and what to do next, written for a person to\
            \ read. Never contains a stack trace, SQL, or an internal type name."
          example: 1 field is invalid.
        instance:
          type: string
          format: uri-reference
          description: Path of the request that failed.
          example: /api/projects
        invalidFields:
          type: array
          description: "Present on `422` validation failures. Names every field that\
            \ was rejected, so a client can attach each message to the control it\
            \ belongs to rather than to the form as a whole."
          items:
            type: object
            description: One field the request was rejected for.
            properties:
              field:
                type: string
                description: "Path of the rejected field, as it appears in the request\
                  \ body."
                example: name
              message:
                type: string
                description: "What is wrong with the value, phrased for the person\
                  \ who typed it."
                example: must not be blank
            required:
            - field
            - message
        status:
          type: integer
          format: int32
          description: "HTTP status code, repeated here so a logged body is self-contained."
          example: 422
          maximum: 599
          minimum: 400
        timestamp:
          type: string
          format: date-time
          description: "When the failure was recorded, UTC."
          example: 2026-02-17T09:41:12.884Z
        title:
          type: string
          description: Short summary of the problem type. Does not vary between occurrences.
          example: Validation failed
        traceId:
          type: string
          description: "Identifies this request in the server logs, and is also returned\
            \ in the `X-Trace-Id` header. Quote it when reporting a problem."
          example: 4f8a1c2e9b7d6a5f3e2d1c0b9a8f7e6d
          pattern: "^[0-9a-f]{32}$"
        type:
          type: string
          format: uri-reference
          description: "Stable identifier for this kind of problem, relative to the\
            \ API host. Safe to branch on — unlike `detail`, its value does not change\
            \ with wording."
          example: /problems/validation-failed
      required:
      - detail
      - status
      - title
      - traceId
      - type
    ProcessingResponse:
      type: object
      description: "The version an operation committed. Fetch the bytes from `GET\
        \ /api/documents/{documentId}/versions/{versionNumber}/file`."
      properties:
        createdAt:
          type: string
          format: date-time
          description: "When the version was committed, UTC."
          example: 2026-02-21T11:04:55
        details:
          type: object
          additionalProperties: {}
          description: "Counts and figures particular to the operation that ran —\
            \ pages processed, regions redacted, fields filled. The members differ\
            \ by operation, so they are carried here rather than spread across the\
            \ shared shape as fields that are null most of the time."
          example:
            pagesProcessed: 14
            pagesWithText: 12
        documentId:
          type: integer
          format: int64
          description: Document that was rewritten.
          example: 1180
        fileSize:
          type: integer
          format: int64
          description: Size of the committed version in bytes.
          example: 5242880
          minimum: 0
        operation:
          type: string
          description: Which operation ran.
          enum:
          - UPLOAD
          - REDACT
          - OCR
          - FLATTEN
          - FORM_FILL
          - FORM_DESIGN
          - PAGES
          - SIGN
          - RESTORE
          example: OCR
        success:
          type: boolean
          description: "Always true. An operation that failed returns a problem document,\
            \ not this shape."
          example: true
        summary:
          type: string
          description: "What changed, in one line."
          example: Recognised text on 12 of 14 pages.
        version:
          type: integer
          format: int32
          description: Version number this operation committed.
          example: 4
          minimum: 1
      required:
      - createdAt
      - documentId
      - operation
      - success
      - summary
      - version
    ProjectRequest:
      type: object
      description: Details of a project to create or replace. Tenant and owner are
        taken from the authenticated principal and are not settable here.
      properties:
        description:
          type: string
          description: Free text describing the scope of works.
          example: Platform extension and signalling upgrade.
          maxLength: 2000
          minLength: 0
        location:
          type: string
          description: "Where the works are. Free text rather than coordinates, because\
            \ this is for people reading a list, not for mapping."
          example: "Riverside, South Yard"
          maxLength: 200
          minLength: 0
        name:
          type: string
          description: Name shown wherever the project is listed.
          example: Riverside Depot — Stage 2
          maxLength: 200
          minLength: 0
        phase:
          type: string
          description: "Delivery phase. Defaults to `CONCEPT` on creation. On replacement,\
            \ omitting it keeps the current phase rather than clearing it — a project\
            \ moves through phases in order, and an omission should not walk it backwards."
          enum:
          - CONCEPT
          - DESIGN
          - CONSTRUCTION
          - HANDOVER
          - OPERATION
          example: DESIGN
      required:
      - name
    ProjectResponse:
      type: object
      description: A project as it currently stands.
      properties:
        createdAt:
          type: string
          format: date-time
          description: "When the project was created, UTC."
          example: 2026-01-08T11:20:04
          readOnly: true
        description:
          type: string
          description: Free text describing the scope of works.
          example: Platform extension and signalling upgrade.
        documentCount:
          type: integer
          format: int32
          description: How many documents the project holds. Present so a list can
            show it without a follow-up request per row.
          example: 37
          minimum: 0
          readOnly: true
        id:
          type: integer
          format: int64
          description: Identifier of the project.
          example: 42
          readOnly: true
        location:
          type: string
          description: Where the works are.
          example: "Riverside, South Yard"
        name:
          type: string
          description: Name shown wherever the project is listed.
          example: Riverside Depot — Stage 2
        ownerUsername:
          type: string
          description: Sign-in name of the account that owns the project.
          example: j.okafor
          readOnly: true
        phase:
          type: string
          description: Delivery phase.
          enum:
          - CONCEPT
          - DESIGN
          - CONSTRUCTION
          - HANDOVER
          - OPERATION
          example: DESIGN
        updatedAt:
          type: string
          format: date-time
          description: "When any detail of the project last changed, UTC."
          example: 2026-02-14T16:05:51
          readOnly: true
      required:
      - createdAt
      - documentCount
      - id
      - name
      - phase
    RedactRequest:
      type: object
      description: Regions whose content is to be destroyed.
      properties:
        regions:
          type: array
          description: Rectangles to redact. Coordinates are PDF points with a bottom-left
            origin.
          example:
          - page: 2
            x: 120.5
            "y": 338.0
            width: 210.0
            height: 18.0
          items:
            type: object
            additionalProperties: {}
          minItems: 1
      required:
      - regions
    RegisterRequest:
      type: object
      description: "Details for a new account. A tenant still cannot be named here,\
        \ because accepting one would let any caller create an account inside another\
        \ organisation. Without an invitation the account gets a new tenant of its\
        \ own; with one it joins the tenant that issued it, which is proof rather\
        \ than an assertion."
      properties:
        email:
          type: string
          format: email
          description: "Contact address, unique within the tenant. Used for password\
            \ reset and expiry warnings, so an address the person can actually read\
            \ matters."
          example: j.okafor@example.test
          maxLength: 254
          minLength: 0
        invitationToken:
          type:
          - string
          - "null"
          description: "An invitation issued by an administrator of the organisation\
            \ to join. Omit it to create a new organisation instead. The invited email\
            \ address must match the one above, so a forwarded invitation does not\
            \ admit whoever received it."
          example: cdeinv_c3ludGhldGljLXNhbXBsZS10b2tlbi12YWx1ZQ
          maxLength: 100
          minLength: 0
          writeOnly: true
        organisationName:
          type:
          - string
          - "null"
          description: "What to call the new organisation. Ignored when an invitation\
            \ is presented, because that organisation already has a name. Omit it\
            \ and one is derived from the username — signing up should not require\
            \ a decision nobody has made yet."
          example: Okafor Engineering
          maxLength: 200
          minLength: 0
        password:
          type: string
          format: password
          description: Chosen password. Checked against the tenant's policy and against
            known-breached password sets; long passphrases are preferred to short
            complex ones. Never returned by any endpoint.
          example: correct-horse-battery-staple-42
          maxLength: 128
          minLength: 12
          writeOnly: true
        username:
          type: string
          description: Unique sign-in name within the tenant.
          example: j.okafor
          maxLength: 60
          minLength: 0
      required:
      - email
      - password
      - username
    RemoveFieldsRequest:
      type: object
      description: "Fields to remove, by name."
      properties:
        names:
          type: array
          description: Names of the fields to remove.
          example:
          - contractor_name
          - inspection_date
          items:
            type: string
          minItems: 1
      required:
      - names
    ReplyRequest:
      type: object
      description: A reply to add to a markup thread.
      properties:
        content:
          type: string
          description: What the reply says.
          example: Level confirmed at 24.150 — no change needed.
          maxLength: 4000
          minLength: 0
      required:
      - content
    ReplyResponse:
      type: object
      description: One reply in a markup thread.
      properties:
        annotationId:
          type: integer
          format: int64
          description: Markup this reply belongs to.
          example: 9042
        authorName:
          type: string
          description: Sign-in name of the account that wrote it.
          example: a.silva
          readOnly: true
        content:
          type: string
          description: What the reply says.
          example: Level confirmed at 24.150 — no change needed.
        createdAt:
          type: string
          format: date-time
          description: "When the reply was written, UTC."
          example: 2026-02-20T08:02:17
          readOnly: true
        id:
          type: integer
          format: int64
          description: Identifier of the reply.
          example: 3311
          readOnly: true
      required:
      - annotationId
      - authorName
      - content
      - createdAt
      - id
    RevisionRequest:
      type: object
      description: |-
        A new revision of a container, created in work in progress.

        Supply `supersedesRevisionId` to issue a revision that replaces the container's current published one. That is the only way published information changes: the superseded revision is archived rather than edited, and stays retrievable.
      properties:
        revisionCode:
          type: string
          description: "The revision identifier, in the project's own scheme — preliminary\
            \ or contractual. Validated for length and uniqueness within the container,\
            \ not against a shipped format."
          example: P01.01
          maxLength: 20
          minLength: 0
        supersedesRevisionId:
          type:
          - integer
          - "null"
          format: int64
          description: "The published revision this one replaces. Omit for the first\
            \ revision of a container, or for a further revision that does not supersede\
            \ anything."
          example: 2048
      required:
      - revisionCode
    RevisionResponse:
      type: object
      description: One revision of a container.
      properties:
        approvalReason:
          type:
          - string
          - "null"
          description: The authorisation recorded at publication.
          example: Approved for construction.
        containerId:
          type: integer
          format: int64
          description: The container this revision belongs to.
          example: 1024
        createdAt:
          type: string
          format: date-time
          description: When the revision was created.
          example: 2026-03-04T09:15:00
        createdBy:
          type: string
          description: Username of whoever created the revision.
          example: a.surveyor
        currentPublished:
          type: boolean
          description: "Whether this revision is the container's current authorised\
            \ expression — published and not yet superseded. At most one revision\
            \ of a container can be, and the database enforces that."
          example: false
        documentId:
          type:
          - integer
          - "null"
          format: int64
          description: "The document holding this revision's content, where one is\
            \ linked."
          example: 512
        id:
          type: integer
          format: int64
          description: Identifier of the revision.
          example: 2049
        publishedAt:
          type:
          - string
          - "null"
          format: date-time
          description: When the revision was published. Null until published.
          example: 2026-03-11T16:40:00
        publishedBy:
          type:
          - string
          - "null"
          description: Username of whoever authorised publication. Null until published.
          example: l.reviewer
        revisionCode:
          type: string
          description: The revision identifier in the project's scheme.
          example: P01.02
        state:
          type: string
          description: The revision's current state.
          enum:
          - WORK_IN_PROGRESS
          - SHARED
          - PUBLISHED
          - ARCHIVED
          example: SHARED
        suitabilityCode:
          type:
          - string
          - "null"
          description: "The suitability code applied, if any."
          example: S2
        supersededByRevisionCode:
          type:
          - string
          - "null"
          description: "The revision that replaced this one, by its code."
          example: C01
        supersedesRevisionCode:
          type:
          - string
          - "null"
          description: "The revision this one replaced, by its code."
          example: P01.01
    RevisionTransitionResult:
      type: object
      description: "The outcome of a state change: the revision as it now stands,\
        \ and the transition recorded for it. Both, because a client needs the new\
        \ state to render and the transition to append to a history it is already\
        \ showing."
      properties:
        revision:
          $ref: "#/components/schemas/RevisionResponse"
          description: The revision after the change.
        transition:
          $ref: "#/components/schemas/ContainerTransitionResponse"
          description: The transition that was recorded.
    SignatureRequest:
      type: object
      description: Optional context recorded alongside a signature. The signer's identity
        comes from the authenticated principal and is not settable here.
      properties:
        location:
          type: string
          description: "Where it was signed, as recorded in the signature dictionary."
          example: "Manchester, UK"
          maxLength: 120
          minLength: 0
        reason:
          type: string
          description: Why the document is being signed.
          example: Approved for construction
          maxLength: 240
          minLength: 0
        role:
          type: string
          description: Capacity the person is signing in.
          example: Lead Structural Engineer
          maxLength: 120
          minLength: 0
    SignatureResponse:
      type: object
      description: A signature held against a document.
      properties:
        id:
          type: integer
          format: int64
          description: Database identifier of the signature record.
          example: 512
          readOnly: true
        reason:
          type: string
          description: "Why the document was signed, empty when none was given."
          example: Approved for construction
        role:
          type: string
          description: "Capacity the person signed in, empty when none was given."
          example: Lead Structural Engineer
        signatureId:
          type: string
          description: "Stable public identifier, used to verify or revoke this signature."
          example: sig_7f3a91c4e2b8
        signedAt:
          type: string
          format: date-time
          description: "When the document was signed, UTC."
          example: 2026-02-21T10:33:09
          readOnly: true
        signerEmail:
          type: string
          format: email
          description: "Contact address of the signer, empty when none was held."
          example: j.okafor@example.test
        signerName:
          type: string
          description: "Name of the person who signed, as held at the time of signing."
          example: J. Okafor
        status:
          type: string
          description: Whether the signature still stands.
          enum:
          - VALID
          - INVALID
          - TAMPERED
          - EXPIRED
          example: VALID
        version:
          type: integer
          format: int32
          description: Version of the document this signature attests to. A signature
            on version 2 says nothing about version 5.
          example: 2
          minimum: 1
      required:
      - id
      - signatureId
      - signedAt
      - signerName
      - status
    SignatureVerification:
      type: object
      description: The outcome of checking a signature.
      properties:
        embedded:
          type: boolean
          description: Whether the check read the document itself or only this application's
            record of the signature. The difference is whether a recipient outside
            this system could reach the same conclusion.
          example: true
        message:
          type: string
          description: "What the outcome means, phrased for a person."
          example: Signed by J. Okafor on 21 February 2026. The document has not changed
            since.
        status:
          type: string
          description: Machine-readable outcome.
          example: VALID
        valid:
          type: boolean
          description: Whether the signature checks out.
          example: true
      required:
      - embedded
      - message
      - status
      - valid
    SigningResult:
      type: object
      description: "What signing produced: the signature record, the version it committed,\
        \ and whether the signature was written into the file itself."
      properties:
        documentStatus:
          type: string
          description: Review state the document now holds.
          example: APPROVED
        embedded:
          type: boolean
          description: "Whether the signature was embedded in the document itself\
            \ (PAdES), rather than only recorded here. An embedded signature can be\
            \ verified by any conforming reader; a recorded one cannot."
          example: true
        signature:
          $ref: "#/components/schemas/SignatureResponse"
          description: The signature that was created.
        stampSvg:
          type: string
          description: "Visual stamp for the viewer to draw, as SVG markup. Presentation\
            \ only — it is not what makes the signature valid."
          example: <svg xmlns="http://www.w3.org/2000/svg" width="220" height="64"/>
        version:
          type: integer
          format: int32
          description: Version number this signing committed.
          example: 3
          minimum: 1
      required:
      - documentStatus
      - embedded
      - signature
      - version
    SuitabilityAssignmentRequest:
      type: object
      description: The suitability code to apply to a revision — what the information
        may be relied on for.
      properties:
        suitabilityCodeId:
          type:
          - integer
          - "null"
          format: int64
          description: "The code to apply, from the project's own list. Send null\
            \ to clear the current one."
          example: 7
    SuitabilityCodeRequest:
      type: object
      description: A suitability code the project defines for itself — what information
        carrying it may be relied on for.
      properties:
        code:
          type: string
          description: The short code as the organisation writes it.
          example: S2
          maxLength: 20
          minLength: 0
        description:
          type: string
          description: "What the code means, in the project's own words."
          example: Suitable for information
          maxLength: 255
          minLength: 0
        displayOrder:
          type: integer
          format: int32
          default: 0
          description: Where the code sits in the list the user picks from. Codes
            with the same order are returned in an unspecified order relative to each
            other.
          example: 20
        validInState:
          type:
          - string
          - "null"
          description: |-
            The container state this code may be applied in. Omit it and the code applies in any state.

            Setting it is what stops a drawing being marked approved for construction while it is still unverified work in progress — which is most of the reason the list exists.
          enum:
          - WORK_IN_PROGRESS
          - SHARED
          - PUBLISHED
          - ARCHIVED
          example: SHARED
      required:
      - code
      - description
    SuitabilityCodeResponse:
      type: object
      description: A suitability code as stored.
      properties:
        active:
          type: boolean
          description: "Whether the code is still offered. Codes are retired rather\
            \ than deleted, so revisions that already carry one keep their meaning."
          example: true
        code:
          type: string
          description: The short code.
          example: S2
        description:
          type: string
          description: What it means.
          example: Suitable for information
        displayOrder:
          type: integer
          format: int32
          description: Where it sits in the list.
          example: 20
        id:
          type: integer
          format: int64
          description: Identifier of the code.
          example: 7
        projectId:
          type:
          - integer
          - "null"
          format: int64
          description: The project the code belongs to. Null for a code defined across
            the whole tenant.
          example: 42
        validInState:
          type:
          - string
          - "null"
          description: "The container state it may be applied in, or null for any."
          enum:
          - WORK_IN_PROGRESS
          - SHARED
          - PUBLISHED
          - ARCHIVED
          example: SHARED
    SvgPayload:
      type: object
      description: "A drawing, as SVG markup ready to render. Used for uploaded SVG\
        \ and for CAD converted to it."
      properties:
        content:
          type: string
          description: The SVG markup itself.
          example: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841 595"/>
        drawingNumber:
          type: string
          description: "Drawing number from the title block, empty when none is held."
          example: RVD-XX-02-DR-A-1200
        name:
          type: string
          description: The document's display name.
          example: GA Plan — Level 02
        renderedBy:
          type: string
          description: "Which converter produced the markup. Present for converted\
            \ CAD only, and useful when a drawing renders oddly — the fallback renderer\
            \ supports less than the primary one."
          example: ezdxf
        revision:
          type: string
          description: "Revision identifier, empty when none is held."
          example: P02.1
        type:
          type: string
          description: Always `svg`.
          enum:
          - svg
          example: svg
      required:
      - content
      - name
      - type
    TextMatch:
      type: object
      description: "One occurrence of a search term. Coordinates are PDF points with\
        \ a bottom-left origin, padded slightly so a redaction covering the box does\
        \ not leave the glyph edges showing."
      properties:
        height:
          type: number
          format: double
          description: "Height of the match box, in points."
          example: 11.8
          minimum: 0
        page:
          type: integer
          format: int32
          description: One-based page the match sits on.
          example: 4
          minimum: 1
        pattern:
          type: string
          description: "Which term, preset or expression matched."
          example: email
        text:
          type: string
          description: The matched text exactly as it appears in the document.
          example: j.okafor@example.test
        width:
          type: number
          format: double
          description: "Width of the match box, in points."
          example: 146.2
          minimum: 0
        x:
          type: number
          format: double
          description: "Distance from the left edge, in points."
          example: 120.5
        "y":
          type: number
          format: double
          description: "Distance from the bottom edge, in points."
          example: 338.0
      required:
      - height
      - page
      - pattern
      - text
      - width
      - x
      - "y"
    TextSearchRequest:
      type: object
      description: "What to look for. At least one of `terms`, `presets` or `regexes`\
        \ must be given; supplying several searches for all of them."
      properties:
        matchCase:
          type: boolean
          default: false
          description: Whether letter case must match. Applies to `terms` only.
          example: false
        presets:
          type: array
          description: "Named categories of sensitive value, matched by patterns maintained\
            \ by the conversion service rather than by the caller. An unrecognised\
            \ name is rejected rather than quietly matching nothing."
          example:
          - email
          - niNumber
          items:
            type: string
            description: A named category of sensitive value that redaction can find
              on its own.
            enum:
            - email
            - phone
            - creditCard
            - ssn
            - niNumber
            - postcode
            - iban
        regexes:
          type: array
          description: "Regular expressions to match. Evaluated server-side against\
            \ page text, so an expression that backtracks badly costs the request\
            \ its own time budget and nothing else."
          example:
          - "[A-Z]{3}-[0-9]{4}"
          items:
            type: string
        terms:
          type: array
          description: Literal strings to look for.
          example:
          - Confidential
          - Draft only
          items:
            type: string
        wholeWord:
          type: boolean
          default: false
          description: Whether a match must be a whole word rather than part of a
            longer one. Applies to `terms` only.
          example: true
    TextSearchResponse:
      type: object
      description: "Where a set of search terms occurs in a document. Pages carrying\
        \ no extractable text at all are listed separately, because a page that matched\
        \ nothing and a page that could not be read are different answers — the second\
        \ usually means the document needs OCR first."
      properties:
        error:
          type: string
          description: Why the search could not run. Present only when `success` is
            false.
          example: File not found
        matchCount:
          type: integer
          format: int32
          description: How many occurrences were found.
          example: 7
          minimum: 0
        matches:
          type: array
          description: "Every occurrence, in page order."
          items:
            $ref: "#/components/schemas/TextMatch"
        pagesWithoutText:
          type: array
          description: One-based pages that carry no extractable text. A scanned page
            appears here until OCR has run over it.
          example:
          - 13
          - 14
          items:
            type: integer
            format: int32
        success:
          type: boolean
          description: Whether the search ran. False means the document could not
            be read.
          example: true
      required:
      - success
    TransitionRequest:
      type: object
      description: |-
        A move to a new state.

        This is the only way a revision's state changes; there is no writable state field. Which moves are legal depends on the current state — work in progress may be shared or archived, shared may be published, rejected back to work in progress, or archived, and published may only be superseded. An illegal move returns `409`.
      properties:
        reason:
          type: string
          description: "Why. Required on every transition, including the ones where\
            \ it might feel like ceremony: this is the text that answers \"on whose\
            \ authority, and why\" years later, and a transition history of blank\
            \ reasons is not an audit trail. On a move to `PUBLISHED` it is recorded\
            \ as the authorisation."
          example: Checked against the coordination model and approved for construction.
          maxLength: 1000
          minLength: 0
        toState:
          type: string
          description: The state to move to.
          enum:
          - WORK_IN_PROGRESS
          - SHARED
          - PUBLISHED
          - ARCHIVED
          example: SHARED
      required:
      - reason
      - toState
    UnopenablePayload:
      type: object
      description: |-
        The document exists but this viewer cannot open it, and why. Returned with `200` — read `type` rather than the status.

        `dwg_binary` means a DWG whose converter is not installed; `office_error` an Office document that could not be converted; `revit_binary` a Revit file, which needs Revit; `3d_error` a model the conversion service could not read; `unsupported` a format nothing here handles.
      properties:
        error:
          type: string
          description: "Why it could not be opened, where a reason is known."
          example: converter_offline
        ext:
          type: string
          description: "The file's extension, for a client choosing what to suggest."
          example: rvt
        fileName:
          type: string
          description: Name of the underlying file.
          example: depot-structural.rvt
        libredwgInstalled:
          type: boolean
          description: Whether LibreDWG is installed. `dwg_binary` only.
          example: true
        loInstalled:
          type: boolean
          description: Whether LibreOffice is installed. `office_error` only.
          example: true
        name:
          type: string
          description: The document's display name.
          example: Depot — Structural
        odaInstalled:
          type: boolean
          description: Whether the ODA converter is installed. `dwg_binary` only.
          example: false
        type:
          type: string
          description: Which kind of unopenable this is.
          enum:
          - dwg_binary
          - office_error
          - revit_binary
          - 3d_error
          - unsupported
          example: revit_binary
        version:
          type: string
          description: "Which DWG release the file is, where it could be read from\
            \ the header. `dwg_binary` only."
          example: AC1032
      required:
      - name
      - type
    ViewerErrorPayload:
      type: object
      description: "The document could not be read at all — no file recorded, or the\
        \ file is missing from storage. Returned with `200`; read `type`."
      properties:
        error:
          type: string
          description: "What went wrong, phrased for a person."
          example: This document has no file behind it.
        type:
          type: string
          description: Always `error`.
          enum:
          - error
          example: error
      required:
      - error
      - type
    ViewerPayload:
      description: |-
        What the viewer needs to open a document. Read `type` first — it decides which other members are present.

        Note that the failure variants (`error`, `dwg_binary`, `office_error`, `3d_error`, `revit_binary`, `unsupported`) are returned with `200`, so a successful status does not mean the document opened. Branch on `type`.
      discriminator:
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/SvgPayload"
      - $ref: "#/components/schemas/PdfPayload"
      - $ref: "#/components/schemas/ModelPayload"
      - $ref: "#/components/schemas/UnopenablePayload"
      - $ref: "#/components/schemas/ViewerErrorPayload"
    XfdfImportResponse:
      type: object
      description: Result of importing markup from an XFDF file. A file containing
        no markup is not an error — it imports nothing and says so.
      properties:
        annotations:
          type: array
          description: "The markup that was created, in file order."
          items:
            $ref: "#/components/schemas/AnnotationResponse"
        imported:
          type: integer
          format: int32
          description: How many pieces of markup were created.
          example: 14
          minimum: 0
        message:
          type: string
          description: "What happened, phrased for the person who chose the file."
          example: Imported 14 annotations.
      required:
      - annotations
      - imported
      - message
  securitySchemes:
    apiKey:
      description: "Machine credential, sent as `X-API-Key`. Shown once at creation\
        \ and stored only as a SHA-256 digest, so a lost key is replaced rather than\
        \ recovered. Scoped, expiring, and rate-limited per key."
      in: header
      name: X-API-Key
      type: apiKey
    bearerAuth:
      bearerFormat: JWT
      description: "Signed JSON Web Token from `POST /api/auth/login`, sent as `Authorization:\
        \ Bearer <token>`. The token carries the subject and the tenant; the tenant\
        \ claim is authoritative and is not overridable by any request parameter."
      scheme: bearer
      type: http
    oauth2:
      description: Authorization code with PKCE for user-facing clients; client credentials
        for machine clients. The implicit flow is not offered.
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          refreshUrl: /oauth2/token
          scopes:
            annotation:read: Read markup on a document
            annotation:write: "Create, update and resolve markup"
            document:process: Run operations that rewrite a document
            document:read: Read document metadata and content
            document:write: "Upload, replace and delete documents"
            project:read: List and read projects
            project:write: "Create, update and delete projects"
            signature:read: Read and verify digital signatures
            signature:write: Apply a digital signature to a document version
          tokenUrl: /oauth2/token
        clientCredentials:
          scopes:
            annotation:read: Read markup on a document
            annotation:write: "Create, update and resolve markup"
            document:process: Run operations that rewrite a document
            document:read: Read document metadata and content
            document:write: "Upload, replace and delete documents"
            project:read: List and read projects
            project:write: "Create, update and delete projects"
            signature:read: Read and verify digital signatures
            signature:write: Apply a digital signature to a document version
          tokenUrl: /oauth2/token
      type: oauth2
    sessionCookie:
      description: "Browser session cookie: `HttpOnly`, `Secure`, `SameSite=Lax`,\
        \ `__Host-` prefixed. State-changing requests additionally require a CSRF\
        \ token."
      in: cookie
      name: __Host-session
      type: apiKey
