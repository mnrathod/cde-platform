            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Remove one reply from a thread
      tags:
      - Annotations
  /api/annotations/{annotationId}/replies:
    get:
      description: |-
        Replies in the order they were written, oldest first, which is how a conversation reads.

        Requires the `annotation:read` permission.
      operationId: listAnnotationReplies
      parameters:
      - description: Identifier of the markup.
        example: 9042
        in: path
        name: annotationId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReplyResponse"
          description: "The thread, oldest reply first."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
            \ outside an accepted set. No field can be named, because parsing did\
