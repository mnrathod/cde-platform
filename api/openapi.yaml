        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The request failed for a reason the caller cannot act on. Quote
            the `traceId` when reporting it.
      summary: Read a markup thread
      tags:
      - Annotations
    post:
      description: |-
        The author is the authenticated caller and cannot be supplied.

        Everyone viewing the document is notified over the collaboration channel.

        Requires the `annotation:write` permission.
      operationId: addAnnotationReply
      parameters:
      - description: Identifier of the markup to reply to.
        example: 9042
        in: path
        name: annotationId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyResponse"
          description: The reply as written.
