      summary: Reply in a markup thread
      tags:
      - Annotations
  /api/annotations/{id}:
    delete:
      description: |-
        Not reversible, and it takes the reply thread with it. Resolving is usually what is wanted instead: it records that the point was addressed rather than erasing that it was raised.

        Requires the `annotation:write` permission.
      operationId: deleteAnnotation
      parameters:
      - description: Identifier of the markup.
        example: 9042
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: The markup and its replies are gone.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request could not be read — malformed JSON, or a value\
