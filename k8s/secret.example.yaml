# An EXAMPLE. Do not apply it, and do not commit a filled-in copy.
#
# The JWT signing secret has no default anywhere. JwtProperties refuses to bind
# a missing, short, or previously-committed value, so the application stops at
# startup rather than booting able to verify tokens anyone can mint. The
# Deployment reads CDE_JWT_SECRET from the Secret below with optional:false, so
# a missing Secret fails the pod at the same point for the same reason.
#
# The placeholder that used to ship in application.yml is in the git history
# permanently and is refused by name — reusing it will not start the process.
#
# Create the real one out of band:
#
#   kubectl create secret generic cde-platform-secrets \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=anthropic-api-key="sk-ant-..."
#
# Rotating it invalidates every issued token, which signs everyone out. That
# is the intended effect if the current value has ever been public.
apiVersion: v1
kind: Secret
metadata:
  name: cde-platform-secrets
  labels:
    app.kubernetes.io/name: cde-platform
type: Opaque
stringData:
  # At least 32 bytes: the HS256 signer rejects anything shorter.
  jwt-secret: "REPLACE-ME-generate-with-openssl-rand-base64-48"
  # Read by both the application and the PostgreSQL StatefulSet, so changing
  # the password means recreating the database or altering the role — the
  # StatefulSet only reads it when initialising an empty data directory.
  db-username: "cde"
  db-password: "REPLACE-ME-generate-with-openssl-rand-base64-32"
  # Optional. The AI endpoints degrade without it; nothing else is affected.
  anthropic-api-key: ""
