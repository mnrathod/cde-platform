apiVersion: v1
kind: ConfigMap
metadata:
  name: cde-platform-config
  labels:
    app.kubernetes.io/name: cde-platform
    app.kubernetes.io/component: config
data:
  # The converter runs as a second container in the same pod, so it is
  # reachable on the pod's own loopback address. Nothing else in the cluster
  # should be able to reach it — see networkpolicy.yaml.
  CDE_CONVERTER_URL: "http://localhost:5001"

  # Must match the mount path of the uploads volume in both containers. The
  # application sends the converter absolute paths and the converter opens
  # them directly, so the two must agree exactly.
  CDE_STORAGE_UPLOAD_DIR: "/app/uploads"

  # Host is the headless Service in postgres.yaml. Credentials come from the
  # Secret, not from here.
  SPRING_DATASOURCE_URL: "jdbc:postgresql://cde-postgres:5432/cdedb"

  SPRING_PROFILES_ACTIVE: "kubernetes"

  # Where the image stages the built browser application (ADR 15). Setting
  # this is what makes the pod serve the viewer and its /embed document as
  # well as the API — ingress.yaml routes "/" here, so without it every page
  # request reaches this container and gets a 404.
  #
  # Comment it out if you serve the Angular build from your own web tier. Do
  # not point it anywhere else: an image built without staging has only an
  # empty /app/web, and the application refuses to start rather than serve
  # pages that are not there.
  CDE_WEB_APP_PATH: "/app/web"

  # Hosts permitted to frame /embed (ADR 14). Empty, so nothing may — set it
  # to your integrator's origin to open the embed, and note that this alone
  # is what makes the viewer framable. Wildcards are refused at startup.
  #
  #   CDE_WEB_EMBED_PARENT_ORIGINS: "https://cde.customer.example"
  CDE_WEB_EMBED_PARENT_ORIGINS: ""

  # Heap tracks the container memory limit rather than the node's, which is
  # what makes the limit below actually bound the JVM instead of the kernel
  # OOM-killing it. Already the image default; repeated here so changing the
  # limit and the heap stays a single decision.
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
