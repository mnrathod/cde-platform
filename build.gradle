plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.cde'
version = '0.0.1-SNAPSHOT'

// Generates build-info.properties so /actuator/info reports which build is
// running. Without it, "which version is deployed?" is answered by guesswork.
springBoot {
    buildInfo()
}

ext {
    // Spring Boot 3.3 manages Testcontainers 1.19.x, whose bundled docker-java
    // negotiates Docker API 1.32. Engines from 25 onward refuse anything below
    // 1.40, so the managed version cannot talk to a current daemon at all —
    // it reports "could not find a valid Docker environment", which reads like
    // a missing daemon rather than a version mismatch.
    set('testcontainers.version', '1.21.4')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Health, metrics and the liveness/readiness probes Kubernetes needs
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Exposes those metrics in the format Prometheus scrapes
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Real-time collaboration: STOMP over WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // JPA / Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // PostgreSQL in every real environment; H2 stays for the fast test suite.
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    // Schema is owned by migrations, not by Hibernate.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Security + JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // File handling
    implementation 'commons-io:commons-io:2.15.1'
    // Digital signatures (PKI) and embedding them into the PDF itself
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'org.apache.tika:tika-core:2.9.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Runs the real migrations against a real PostgreSQL. The rest of the
    // suite uses H2 for speed, which cannot prove the migrations are correct.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // Activates application-test.yml for every test, so no test class has to
    // remember @ActiveProfiles. Without it the suite would pick up the real
    // datasource and try to reach a PostgreSQL that is not there.
    systemProperty 'spring.profiles.active', 'test'

    // FlywayMigrationIntegrationTest needs a Docker daemon. Opt in rather than
    // fail a checkout that has none; CI should set -Pdocker so the migrations
    // are actually exercised.
    systemProperty 'cde.testcontainers', findProperty('docker') ?: System.getenv('CDE_TESTCONTAINERS') ?: 'false'
}

/**
 * The Python converter is a separate process with its own test suite. It is
 * wired in here so a single `gradlew check` covers both halves of the
 * backend — otherwise CI would build the JVM side and silently skip the
 * service where most of the PDF logic actually lives.
 *
 * Skipped rather than failed when pytest is absent, so a JVM-only checkout
 * still builds. Install with:
 *   pip install -r converter/requirements-dev.txt
 */
tasks.register('converterTest', Exec) {
    group = 'verification'
    description = 'Runs the Python converter test suite (pytest).'
    workingDir = file('converter')
    executable = 'python3'
    args = ['-m', 'pytest', '-q']

    onlyIf {
        def probe = new ByteArrayOutputStream()
        def result = exec {
            commandLine 'python3', '-c', 'import pytest'
            ignoreExitValue = true
            standardOutput = probe
            errorOutput = probe
        }
        if (result.exitValue != 0) {
            logger.lifecycle('converterTest SKIPPED: pytest not installed ' +
                             '(pip install -r converter/requirements-dev.txt)')
        }
        result.exitValue == 0
    }
}

tasks.named('check') {
    dependsOn 'converterTest'
}

