plugins {
    id 'java'
    // Core Gradle plugin, versioned with Gradle itself — nothing to pin.
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cde'
version = '0.0.1-SNAPSHOT'

// Generates build-info.properties so /actuator/info reports which build is
// running. Without it, "which version is deployed?" is answered by guesswork.
springBoot {
    buildInfo()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Jackson 3. Boot 4's JacksonAutoConfiguration produces a
    // tools.jackson.databind.json.JsonMapper and no longer registers a
    // Jackson 2 ObjectMapper bean, so this is what the application actually
    // serialises with. Jackson 2 still arrives transitively via springdoc's
    // swagger-core; that copy is an implementation detail of springdoc and
    // must not be what our code binds to.
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    // OpenAPI 3.1, generated from the controller and DTO annotations rather
    // than hand-written, so the specification cannot drift from the code
    // (§3.5). The 3.x line is the one built against Spring Boot 4 / Spring
    // Framework 7; the 2.x lines target Boot 3 and pull a Swagger Core that
    // expects APIs Framework 7 no longer has.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    // Health, metrics and the liveness/readiness probes Kubernetes needs
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Exposes those metrics in the format Prometheus scrapes
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Real-time collaboration: STOMP over WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // JPA / Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // PostgreSQL everywhere, including the test suite. H2 is gone: it has no
    // Row-Level Security, so tests against it reported tenant isolation
    // working while the mechanism under test did not exist.
    runtimeOnly 'org.postgresql:postgresql'
    // Schema is owned by migrations, not by Hibernate.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    // Spring Boot 4 split autoconfiguration out of spring-boot-autoconfigure
    // into a module per technology. Flyway's lives here, and DataSourceConfig
    // needs @FlywayDataSource from it to hand migrations the unrestricted
    // DataSource. Version comes from the Boot BOM.
    implementation 'org.springframework.boot:spring-boot-flyway'

    // Security + JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // File handling
    implementation 'commons-io:commons-io:2.22.0'
    // Digital signatures (PKI) and embedding them into the PDF itself.
    // The two versions differ deliberately: 1.85.2 is a patch release of the
    // provider alone, and bcpkix has no matching build. bcpkix 1.85 resolves
    // bcprov transitively at 1.85, so declaring the provider explicitly is what
    // pulls the patch in.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.apache.tika:tika-core:4.0.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // @AutoConfigureMockMvc moved out of spring-boot-test-autoconfigure in
    // Boot 4, along with the rest of the per-technology split. The starter no
    // longer brings it, so the MockMvc-based suites need it declared.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    // Boot disables metrics export in tests, so ActuatorEndpointSecurityTest
    // needs @AutoConfigureMetrics to assert the Prometheus endpoint's exposure
    // as production sees it. Boot 4 renamed it from @AutoConfigureObservability
    // and moved it here.
    testImplementation 'org.springframework.boot:spring-boot-micrometer-metrics-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Boot 4's @AutoConfigureMockMvc imports only the three MockMvc
    // autoconfigurations; the Spring Security integration that used to come
    // with it lives here now. Without it @WithMockUser has no effect and every
    // authenticated MockMvc test gets a 401 — including the cross-tenant
    // isolation suite, which would then pass for the wrong reason.
    testImplementation 'org.springframework.boot:spring-boot-security-test'
    // Every test runs against a real PostgreSQL, started once per JVM by
    // PostgresTestSessionListener.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // Testcontainers 2.x renamed its modules with a testcontainers- prefix;
    // the old coordinates stopped publishing at 1.21.4. Versions come from the
    // Boot BOM, which manages the 2.x line.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // Compile-scope, not runtime: PostgresTestSessionListener implements
    // LauncherSessionListener and so needs the API at compile time.
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // Activates application-test.yml for every test, so no test class has to
    // remember @ActiveProfiles. Without it the suite would pick up the real
    // datasource and try to reach a PostgreSQL that is not there.
    systemProperty 'spring.profiles.active', 'test'

    // The suite requires a Docker daemon, because it requires a real
    // PostgreSQL. This used to be opt-in with an H2 fallback; a suite that
    // silently degrades to a database without RLS is worse than one that
    // refuses to run.
    systemProperty 'cde.testcontainers', 'true'

    // Registers DefaultTenantExtension for every test without each class
    // having to remember @ExtendWith. A test that forgets tenant context does
    // not fail informatively — it reads zero rows and asserts against them.
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'

    // Tests fork their own JVM, which does not inherit -D from the Gradle
    // invocation. Without this the regenerate flag was silently ignored and
    // the run failed with the very message telling you to pass it.
    if (System.getProperty('updateOpenApiSpec')) {
        systemProperty 'updateOpenApiSpec', System.getProperty('updateOpenApiSpec')
        // The comparison would otherwise be skipped as up-to-date on a rerun
        // where nothing else changed.
        outputs.upToDateWhen { false }
    }

    // Docker Hub is not reachable from the build environment; mirror.gcr.io
    // serves the same images. Ryuk is disabled because its own image comes
    // from a registry the proxy blocks — containers are stopped at JVM exit
    // instead.
    environment 'TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX',
                System.getenv('TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX') ?: 'mirror.gcr.io/'
    environment 'TESTCONTAINERS_RYUK_DISABLED',
                System.getenv('TESTCONTAINERS_RYUK_DISABLED') ?: 'true'
}

/**
 * The Python converter is a separate process with its own test suite. It is
 * wired in here so a single `gradlew check` covers both halves of the
 * backend — otherwise CI would build the JVM side and silently skip the
 * service where most of the PDF logic actually lives.
 *
 * Skipped rather than failed when pytest is absent, so a JVM-only checkout
 * still builds. Install with:
 *   pip install -r converter/requirements-dev.txt
 */
tasks.register('converterTest', Exec) {
    group = 'verification'
    description = 'Runs the Python converter test suite (pytest).'
    workingDir = file('converter')
    executable = 'python3'
    args = ['-m', 'pytest', '-q']

    onlyIf {
        // ProcessBuilder rather than Gradle's exec {}: that method was
        // deprecated in Gradle 8 and removed in 9, and an onlyIf predicate
        // that throws does not skip the task — it fails the whole build
        // before a single test runs.
        def probe = new ProcessBuilder('python3', '-c', 'import pytest')
                .redirectErrorStream(true)
                .start()
        probe.inputStream.text          // drain, or the process can block on a full pipe
        boolean available = probe.waitFor() == 0
        if (!available) {
            logger.lifecycle('converterTest SKIPPED: pytest not installed ' +
                             '(pip install -r converter/requirements-dev.txt)')
        }
        available
    }
}

/**
 * §4.1: a bare digest applied to a password is a security defect, and the
 * guidelines require CI to enforce it rather than relying on review.
 *
 * The rule is deliberately narrow. Banning MessageDigest outright would be
 * wrong — SHA-256 is the mandated primitive for the audit-log hash chain
 * (§5.7), API key lookup and file integrity — so this looks for a digest and a
 * password in the same expression, which is the shape the defect actually
 * takes. It also pins password hashing to PasswordEncoderConfig, so a
 * hand-rolled encoder cannot reappear beside the configured one and quietly
 * become what a new call site picks up.
 */
tasks.register('passwordHashingPolicyCheck') {
    group = 'verification'
    description = 'Fails on a bare digest over a password, or an encoder built outside PasswordEncoderConfig.'

    def sources = fileTree('src/main/java') { include '**/*.java' }
    def encoderConfig = 'PasswordEncoderConfig.java'
    inputs.files sources

    doLast {
        def bareDigest = ~/(?:\.digest\s*\([^)]*[Pp]assword)|(?:[Pp]assword[^;]*\.digest\s*\()/
        def directEncoder = ~/new\s+(?:BCrypt|Argon2|Pbkdf2|SCrypt)PasswordEncoder\s*\(/
        def violations = []

        sources.each { file ->
            file.eachLine { line, number ->
                def where = "${file.name}:${number}"
                if (bareDigest.matcher(line).find()) {
                    violations << "$where  bare digest over a password — use the configured PasswordEncoder"
                }
                if (file.name != encoderConfig && directEncoder.matcher(line).find()) {
                    violations << "$where  password encoder built directly — construct it in $encoderConfig"
                }
            }
        }

        if (violations) {
            throw new GradleException(
                "Password hashing policy violated (CLAUDE.md §4.1):\n  " + violations.join('\n  '))
        }
    }
}

/**
 * §3.5: the specification is linted against a ruleset encoding the coverage
 * checklist, and the build fails on an error-level finding.
 *
 * Skipped rather than failed when npx is unavailable, so a checkout without
 * Node still builds — but CI has Node, so CI runs it. Requires network on
 * first run to fetch the linter.
 */
tasks.register('openApiLint', Exec) {
    group = 'verification'
    description = 'Lints /api/openapi.yaml against the Spectral ruleset (CLAUDE.md §3.5).'
    executable = 'npx'
    args = ['--yes', '@stoplight/spectral-cli@6.16.3',
            'lint', 'api/openapi.yaml',
            '--ruleset', '.spectral.yaml',
            '--fail-severity', 'error']

    inputs.file('api/openapi.yaml')
    inputs.file('.spectral.yaml')

    onlyIf {
        // See converterTest above: Gradle 9 removed exec {}, and a throwing
        // onlyIf fails the build rather than skipping the task.
        def probe = new ProcessBuilder('sh', '-c', 'command -v npx')
                .redirectErrorStream(true)
                .start()
        probe.inputStream.text
        boolean available = probe.waitFor() == 0
        if (!available) {
            logger.lifecycle('openApiLint SKIPPED: npx not on PATH')
        }
        available
    }
}

/**
 * Coverage reporting (§14).
 *
 * The report always runs after the tests, so the number is visible on every
 * build rather than only when someone asks for it. Whether falling below a
 * threshold *fails* the build is a separate switch — see jacocoTestCoverageVerification
 * below — because turning the gate on before the codebase clears it would
 * mean either a permanently red build or a threshold set low enough to be
 * meaningless.
 */
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true   // consumed by CI
        html.required = true  // read by people
    }
}

tasks.named('test') {
    finalizedBy jacocoTestReport
}

/**
 * Coverage floors, as a ratchet.
 *
 * §14 requires 90% line and 85% branch. Measured on 2026-08-27 the codebase
 * is at 66.2% line and 47.9% branch, so switching the required figures on
 * today would leave main permanently red — and a gate that is always red is
 * a gate everyone learns to ignore, which is worse than no gate.
 *
 * So the build enforces the *measured floor* instead. Coverage cannot fall,
 * and each improvement is banked by raising these numbers in the same commit.
 * They ratchet up only. Lowering one to make a build pass defeats the whole
 * mechanism and should fail review.
 *
 * `./gradlew jacocoTestCoverageVerification -PtargetCoverage` checks against
 * the §14 figures instead, which is how you see the remaining distance
 * without breaking anyone's build.
 *
 * Nothing is excluded from the measurement. §14 permits excluding generated
 * code, DTOs and config classes, but excluding them would raise the reported
 * number without testing anything more, and the point of the number is to be
 * uncomfortable while it is low.
 */
def measuredLineFloor = '0.66'
def measuredBranchFloor = '0.47'
def targetLine = '0.90'
def targetBranch = '0.85'

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    boolean checkingTarget = project.hasProperty('targetCoverage')

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = (checkingTarget ? targetLine : measuredLineFloor).toBigDecimal()
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = (checkingTarget ? targetBranch : measuredBranchFloor).toBigDecimal()
            }
        }
    }
}

// Licence policy and attribution generation (§2.1, §17.2).
apply from: 'gradle/licences.gradle'

tasks.named('check') {
    dependsOn 'converterTest', 'passwordHashingPolicyCheck', 'openApiLint',
               'checkLicences', 'checkAttribution', 'jacocoTestCoverageVerification'
}

